# Файл перевода сообщений об ошибках (русский)
# Формат: [код ошибки] + "消息模板" (шаблон сообщения) + "教学提示" (обучающая подсказка)
# Плейсхолдеры {期望} {实际} {名称} {变量名} {类型} {特征} подставляет компилятор.

[E0308]
"消息模板" = "Несоответствие типов: ожидается `{期望}`, получено `{实际}`"
"教学提示" = "Проверьте, соответствует ли тип переменной требованиям контекста. Попробуйте преобразовать тип с помощью `как`."

[E0433]
"消息模板" = "Тип `{名称}` не найден"
"教学提示" = "Убедитесь, что нужный модуль или тип импортирован. Импортировать можно ключевым словом `используй`."

[E0384]
"消息模板" = "Невозможно дважды присвоить значение неизменяемой переменной `{变量名}`"
"教学提示" = "Если нужно изменить значение переменной, объявите её через `пусть изменяемый`."

[E0382]
"消息模板" = "Использование значения после перемещения: `{变量名}`"
"教学提示" = "В Rust значение после перемещения использовать нельзя. Используйте `ссылка` (&) или `клонируй()` для избежания перемещения."

[E0502]
"消息模板" = "Невозможно заимствовать `{变量名}` как изменяемое: оно уже заимствовано как неизменяемое"
"教学提示" = "Rust не разрешает одновременные изменяемое и неизменяемое заимствования. Постарайтесь сузить область неизменяемого заимствования."

[E0499]
"消息模板" = "Невозможно несколько раз изменяемо заимствовать `{变量名}`"
"教学提示" = "В каждый момент времени может существовать только одна изменяемая ссылка. Это механизм Rust для предотвращения гонок данных."

[E0277]
"消息模板" = "Тип `{类型}` не реализует трейт `{特征}`"
"教学提示" = "Реализуйте для типа нужный трейт или используйте тип, который уже реализует его."

[E0425]
"消息模板" = "Имя `{名称}` не найдено в этой области видимости"
"教学提示" = "Проверьте, правильно ли написано имя переменной и объявлена ли она в текущей области видимости."

[E0282]
"消息模板" = "Невозможно вывести тип, добавьте аннотацию типа"
"教学提示" = "Компилятор Rust не может вывести тип автоматически. Укажите тип явно, например: `пусть x: целое = 0;`"

[E0601]
"消息模板" = "Функция `главная` не найдена в крейте"
"教学提示" = "Каждой исполняемой программе Rust нужна функция `главная` как точка входа. Добавьте в код: функция главная() { ... }"

# ============================================
# Время жизни и заимствование (E01xx/E04xx/E05xx)
# ============================================

[E0106]
"消息模板" = "Функции не хватает аннотации времени жизни"
"教学提示" = "Когда у функции несколько ссылочных параметров, компилятор не может вывести связи между ними. Укажите время жизни на параметрах и возвращаемом значении, например: функция самаяДлинная<'a>(x: &'a текст, y: &'a текст) -> &'a текст"

[E0107]
"消息模板" = "Неверное количество параметров времени жизни"
"教学提示" = "Количество параметров времени жизни в объявлении не совпадает с использованием. Проверьте аннотации внутри `<>`."

[E0116]
"消息模板" = "Невозможно определить собственную реализацию для внешнего типа"
"教学提示" = "Собственные блоки `реализация` можно определять только для локальных типов. Для внешних типов можно реализовать трейт, но нельзя писать собственный блок `реализация`."

[E0133]
"消息模板" = "Небезопасная операция требует блок unsafe"
"教学提示" = "Разыменование сырых указателей и другие операции должны выполняться в блоке `небезопасно`, так как Rust не может гарантировать их безопасность."

[E0204]
"消息模板" = "Невозможно автоматически вывести Clone"
"教学提示" = "Типы с полями, не реализующими `клонируемый`, не могут автоматически выводить клон. Реализуйте `клонируемый` для типа поля вручную."

[E0210]
"消息模板" = "Тип-параметр должен предшествовать всем локальным типам (правило сироты)"
"教学提示" = "При реализации внешнего трейта для внешнего типа хотя бы трейт или тип должен быть локальным, иначе нарушается правило сироты."

[E0255]
"消息模板" = "Имя уже используется как параметр-тип"
"教学提示" = "Имя переменной не может совпадать с именем параметра-типа. Переименуйте переменную или параметр."

[E0271]
"消息模板" = "Несоответствие типов: ограничение трейта не выполнено"
"教学提示" = "Фактический тип не соответствует ограничениям обобщения. Проверьте, реализует ли тип нужный трейт."

[E0309]
"消息模板" = "Обобщённый параметр не удовлетворяет ограничению трейта"
"教学提示" = "Обобщённый параметр должен удовлетворять ограничению `{特征}` для использования соответствующих методов. Добавьте ограничение в объявление обобщения."

[E0310]
"消息模板" = "Обобщённый параметр не удовлетворяет ограничению Sized"
"教学提示" = "Обобщённые параметры по умолчанию должны иметь известный размер (`фиксированного_размера`). Для типов без размера добавьте ограничение `?фиксированного_размера`."

# ============================================
# Типы и трейты (E03xx/E04xx)
# ============================================

[E0369]
"消息模板" = "Несоответствие типов: невозможно выполнить операцию над `{期望}` и `{实际}`"
"教学提示" = "Типы по обе стороны оператора должны быть совместимы. Проверьте, совпадают ли типы операндов, при необходимости преобразуйте через `как`."

[E0373]
"消息模板" = "Замыкание может пережить заимствованное временное значение"
"教学提示" = "Замыкание захватывает ссылку на временное значение и может жить дольше него. Используйте ключевое слово `перемести` или продлите время жизни значения."

[E0404]
"消息模板" = "Ожидался трейт, но найден тип"
"教学提示" = "В месте `динамический` или ограничения обобщения нужно имя трейта. Проверьте, не ошиблись ли в имени."

[E0407]
"消息模板" = "Метод не является членом этого трейта"
"教学提示" = "При реализации трейта можно определять только методы, объявленные в нём. Проверьте, совпадает ли имя метода с определением трейта."

[E0412]
"消息模板" = "Невозможно найти тип"
"教学提示" = "Используемый тип не существует или не импортирован. Импортируйте его ключевым словом `используй` или проверьте написание."

[E0422]
"消息模板" = "Невозможно найти структуру, перечисление или объединение"
"教学提示" = "Имя для создания структуры не существует. Проверьте написание имени или то, что оно определено в текущей области видимости."

[E0432]
"消息模板" = "Невозможно разрешить путь импорта"
"教学提示" = "Импортируемый модуль или элемент не существует. Проверьте написание пути и то, что модуль объявлен (`модуль xxx;`) и видим."

[E0435]
"消息模板" = "В константе использовано неконстантное значение"
"教学提示" = "Значение `константа` должно быть известно на этапе компиляции. Значения времени выполнения (вызовы функций) нельзя использовать в инициализации константы; используйте `статический` или `пусть`."

[E0436]
"消息模板" = "Дублирование определения функции"
"教学提示" = "В одной области видимости нельзя определить две функции с одним именем. Проверьте повторяющиеся определения `функция xxx()`."

[E0463]
"消息模板" = "Крейт не найден"
"教学提示" = "Внешний пакет не установлен или не объявлен в [dependencies] файла Cargo.toml. Сначала добавьте зависимость."

