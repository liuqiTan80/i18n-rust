"короткое_натуральное" = "u16"
"микро_натуральное" = "u8"
"вещественное" = "f64"
"короткое_вещественное" = "f32"
"текст" = "str"
"байт" = "u8"
"символ" = "char"
"логическое" = "bool"
"строка" = "String"
"ссылка_на_строку" = "&str"
"вектор" = "Vec"
"словарь" = "HashMap"
"опция" = "Option"
"некоторое" = "Some"
"ничто" = "None"
"результат" = "Result"
"успех" = "Ok"
"ошибка" = "Err"
"коробка" = "Box"

# ============================================
# Логические значения
# ============================================
["逻辑值"]
"истина" = "true"
"ложь" = "false"

# ============================================
# Особые значения
# ============================================
["特殊值"]
"пусто" = "()"
"себя" = "self"
"Себя" = "Self"

# ============================================
# Память и ссылки
# ============================================
["内存"]
"ссылка" = "&"
"изменяемая_ссылка" = "&mut"
"разыменование" = "*"
"перемести" = "move"
"коробка" = "Box"

# ============================================
["不安全"]
"небезопасно" = "unsafe"
"асинхронно" = "async"
"ожидай" = "await"
"динамический" = "dyn"

# ============================================
["错误处理"]
"результат" = "Result"
"опция" = "Option"
"некоторое" = "Some"
"ничто" = "None"
