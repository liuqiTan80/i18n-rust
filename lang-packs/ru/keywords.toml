# i18n-rust таблица соответствия ключевых слов (русский)
# Формат: русское имя = "английское имя"

# ============================================
# Ключевые слова объявления
# ============================================
["声明"]
"функция" = "fn"
"пусть" = "let"
"изменяемый" = "mut"
"константа" = "const"
"статический" = "static"
"структура" = "struct"
"перечисление" = "enum"
"тип" = "type"
"трейт" = "trait"
"реализация" = "impl"
"модуль" = "mod"
"публичный" = "pub"
"крейт" = "crate"
"супер" = "super"
"внешний" = "extern"
"используй" = "use"
"как" = "as"
"главная" = "main"
# ============================================
# Ключевые слова управления потоком
# ============================================
["控制流"]
"если" = "if"
"иначе" = "else"
"матч" = "match"
"цикл" = "loop"
"пока" = "while"
"для" = "for"
"в" = "in"
"прерви" = "break"
"продолжи" = "continue"
"верни" = "return"

