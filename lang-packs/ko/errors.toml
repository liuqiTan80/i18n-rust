# 오류 메시지 번역 파일 (한국어)
# 형식: [오류 코드] + "消息模板"(메시지 템플릿) + "教学提示"(학습 힌트)
# {期望} {实际} {名称} {变量名} {类型} {特征} 자리 표시자는 컴파일러가 치환합니다.

[E0308]
"消息模板" = "타입 불일치: 기대 `{期望}`, 실제 `{实际}`"
"教学提示" = "변수의 타입이 문맥의 요구와 일치하는지 확인하세요. 타입 변환에는 `로서`를 사용해 보세요."

[E0433]
"消息模板" = "타입 `{名称}`을(를) 찾을 수 없습니다"
"教学提示" = "필요한 모듈이나 타입이 임포트되었는지 확인하세요. `사용` 키워드로 임포트할 수 있습니다."

[E0384]
"消息模板" = "불변 변수 `{变量名}`에 두 번 값을 할당할 수 없습니다"
"教学提示" = "변수의 값을 변경해야 한다면 `선언 가변`으로 선언하세요."

[E0382]
"消息模板" = "이동 후 값 사용: `{变量名}`"
"教学提示" = "Rust에서 이동된 값은 더 이상 사용할 수 없습니다. `참조`(&)나 `복제()`를 사용해 이동을 피하세요."

[E0502]
"消息模板" = "`{变量名}`이(가) 불변 대여 중이므로 가변 대여할 수 없습니다"
"教学提示" = "Rust는 가변 대여와 불변 대여를 동시에 허용하지 않습니다. 불변 대여의 범위를 좁히세요."

[E0499]
"消息模板" = "`{变量名}`을(를) 동시에 여러 번 가변 대여할 수 없습니다"
"教学提示" = "가변 참조는 동시에 하나만 존재할 수 있습니다. 이는 Rust의 데이터 경쟁 방지 메커니즘입니다."

[E0277]
"消息模板" = "타입 `{类型}`이(가) 트레이트 `{特征}`을(를) 구현하지 않았습니다"
"教学提示" = "해당 타입에 필요한 트레이트를 구현하거나, 이미 구현한 타입을 사용하세요."

[E0425]
"消息模板" = "이 범위에서 이름 `{名称}`을(를) 찾을 수 없습니다"
"教学提示" = "변수 이름의 철자가 맞는지, 현재 범위에서 선언되었는지 확인하세요."

