# エラーメッセージ翻訳ファイル（日本語）
# 形式：[エラーコード] + "消息模板"（メッセージ雛形）+ "教学提示"（学習ヒント）
# プレースホルダ {期望} {实际} {名称} {变量名} {类型} {特征} はコンパイラが置換します。

[E0308]
"消息模板" = "型の不一致：期待 `{期望}`、実際 `{实际}`"
"教学提示" = "変数の型が文脈の要求に合っているか確認してください。型変換には `として` を使ってみましょう。"

[E0433]
"消息模板" = "未解決：未宣言の型 `{名称}` の使用"
"教学提示" = "必要なモジュールや型がインポートされているか確認してください。`使用` キーワードでインポートできます。"

[E0384]
"消息模板" = "不変変数 `{变量名}` に2回代入できません"
"教学提示" = "変数の値を変更したい場合は、`宣言 可変` で宣言してください。"

[E0382]
"消息模板" = "移動後の値の使用：`{变量名}`"
"教学提示" = "Rustでは移動後の値は使用できません。`参照`（&）や `クローン()` を使って移動を回避しましょう。"

[E0502]
"消息模板" = "`{变量名}` は不変借用中のため可変借用できません"
"教学提示" = "Rustでは可変借用と不変借用を同時に持てません。不変借用のスコープを狭めましょう。"

[E0499]
"消息模板" = "`{变量名}` を同時に複数回可変借用できません"
"教学提示" = "可変参照は同時に1つだけです。これはRustのデータ競合防止の仕組みです。"

[E0277]
"消息模板" = "トレイト境界 `{类型}`: `{特征}` が満たされていません"
"教学提示" = "その型に必要なトレイトを実装するか、すでに実装している型を使いましょう。"

[E0425]
"消息模板" = "このスコープ内に値 `{名称}` が見つかりません"
"教学提示" = "変数が現在のスコープで宣言されているか確認してください。変数名の綴りも確認しましょう。"

[E0282]
"消息模板" = "型注釈が必要です"
"教学提示" = "コンパイラが型を推論できません。`宣言 x: 整数 = 0;` のように明示的な型注釈を付けましょう。"

[E0601]
"消息模板" = "クレート内に `主関数` 関数が見つかりません"
"教学提示" = "実行可能なRustプログラムにはエントリポイントとして `主関数` が必要です。`関数 主関数() { ... }` を追加しましょう。"

# ============================================
# ライフタイムと借用（E01xx/E04xx/E05xx）
# ============================================

[E0106]
"消息模板" = "ライフタイム指定子がありません"
"教学提示" = "関数に複数の参照引数があると、コンパイラはその関係を推論できません。引数と戻り値にライフタイム注釈を付けましょう。例：関数 最長<'a>(x: &'a 文字列, y: &'a 文字列) -> &'a 文字列"

[E0107]
"消息模板" = "期待されるライフタイムパラメータの数が正しくありません"
"教学提示" = "ジェネリックや関数宣言のライフタイムパラメータ数が使用箇所と一致しません。`<>` 内の注釈を確認しましょう。"

[E0116]
"消息模板" = "外部型に対する固有のimplを定義できません"
"教学提示" = "固有の `実装` ブロックはローカル型にのみ定義できます。外部型にはトレイトを実装できますが、固有の `実装` ブロックは直接書けません。"

[E0133]
"消息模板" = "unsafe操作にはunsafeブロックが必要です"
"教学提示" = "生ポインタの逆参照などの操作は `安全でない` ブロック内で行う必要があります。Rustはその安全性を保証できないためです。"

[E0204]
"消息模板" = "トレイト `Clone` を自動導出できません"
"教学提示" = "`クローン可能` を実装しないフィールドを持つ型は導出できません。そのフィールド型に `クローン可能` を手動実装しましょう。"

[E0210]
"消息模板" = "型パラメータは最初のローカル型より前に現れる場合、別の型で覆われなければなりません（孤児ルール）"
"教学提示" = "外部トレイトを外部型に実装する場合、トレイトか型の少なくとも一方がローカルである必要があります。そうでないと孤児ルールに違反します。"

[E0255]
"消息模板" = "その名前は既にジェネリックパラメータとして使用されています"
"教学提示" = "変数名はジェネリックパラメータ名と一致させられません。変数かジェネリックパラメータの名前を変更しましょう。"

[E0271]
"消息模板" = "型の不一致：トレイト境界が満たされていません"
"教学提示" = "実際の型がジェネリックの制約を満たしていません。型が必要なトレイトを実装しているか確認しましょう。"

[E0309]
"消息模板" = "ジェネリックパラメータがトレイト境界を満たしていません"
"教学提示" = "ジェネリックパラメータは対応するメソッドを使うためにトレイト境界を満たす必要があります。ジェネリック宣言にトレイト境界を追加しましょう。"

[E0310]
"消息模板" = "ジェネリックパラメータにサイズがありません"
"教学提示" = "ジェネリックパラメータはデフォルトでサイズ固定（`サイズ固定`）です。サイズ不定の型には `?サイズ固定` 境界を付けましょう。"

# ============================================
# 型とトレイト（E03xx/E04xx）
# ============================================

[E0369]
"消息模板" = "`{期望}` と `{实际}` に対する実装がありません"
"教学提示" = "演算子の両側の型は互換性が必要です。オペランドの型が一致するか確認し、必要なら `として` で変換しましょう。"

[E0373]
"消息模板" = "クロージャが現在の関数より長生きする可能性がありますが、一時的な値を借用しています"
"教学提示" = "クロージャが一時的な値への参照を捕捉し、その値より長生きする可能性があります。`移動` キーワードを使うか、値の寿命を延ばしましょう。"

[E0404]
"消息模板" = "トレイトを期待、型を検出"
"教学提示" = "ここではトレイト名が必要です（`動的` やジェネリック境界）。名前の綴りを確認しましょう。"

[E0407]
"消息模板" = "メソッドはトレイトのメンバーではありません"
"教学提示" = "`実装` はトレイトで宣言されたメソッドのみ定義できます。メソッド名がトレイト定義と一致するか確認しましょう。"

[E0412]
"消息模板" = "型が見つかりません"
"教学提示" = "使用した型が存在しないか、インポートされていません。`使用` キーワードでインポートするか、綴りを確認しましょう。"

[E0422]
"消息模板" = "struct、enum、union が見つかりません"
"教学提示" = "構造体を構築するための名前が存在しません。綴りを確認するか、現在のスコープで定義されているか確認しましょう。"

[E0432]
"消息模板" = "未解決のインポート"
"教学提示" = "インポートしたモジュールや要素が存在しません。パスの綴りを確認し、モジュールが宣言（`モジュール xxx;`）され可視であることを確認しましょう。"

[E0435]
"消息模板" = "定数内で非定数値が使用されています"
"教学提示" = "`定数` の値はコンパイル時に既知である必要があります。関数呼び出しなどの実行時値は定数初期化に使えません。代わりに `静的` や `宣言` を使いましょう。"

[E0436]
"消息模板" = "関数が複数回定義されています"
"教学提示" = "同じスコープ内に同名の関数を2つ定義できません。重複した `関数 xxx()` 定義を確認しましょう。"

[E0463]
"消息模板" = "クレートが見つかりません"
"教学提示" = "外部パッケージがインストールされていないか、Cargo.toml の [dependencies] に宣言されていません。先に依存関係を追加しましょう。"

# ============================================
# 所有権と移動（E05xx）
# ============================================

[E0496]
"消息模板" = "ライフタイムがスコープ外に逃げられません"
"教学提示" = "参照のライフタイムは参照先の値のライフタイムを超えられません。データの所有権構造を確認しましょう。"

[E0505]
"消息模板" = "借用中の値は移動できません"
"教学提示" = "借用中は値を移動できません。借用を先に終了するか、`クローン()` でデータをコピーしましょう。"

[E0507]
"消息模板" = "共有参照から値を移動できません"
"教学提示" = "共有参照から値を移動できません。値をクローンするか、可変参照を使いましょう。"

[E0508]
"消息模板" = "配列から値を移動できません"
"教学提示" = "配列の要素は完全に外へ移動できません。インデックス + `クローン()` を使うか、配列をベクタに変換しましょう。"

[E0515]
"消息模板" = "ローカル変数への参照を返せません"
"教学提示" = "ローカル変数は関数終了時に破棄されるため、その参照は返せません。値自体を返すか、`ボックス` を使いましょう。"

[E0530]
"消息模板" = "matchのバインディングはenumバリアントを覆い隠せません"
"教学提示" = "パターン内のバインディング名はenumバリアント名と一致させられません。バインディング変数の名前を変更しましょう。"

[E0539]
"消息模板" = "マクロ引数の数が正しくありません"
"教学提示" = "マクロに渡した引数の数が定義と一致しません。マクロの使い方を確認しましょう。"

[E0559]
"消息模板" = "フィールドが見つかりません"
"教学提示" = "構造体にそのフィールドはありません。フィールド名の綴りを確認するか、使用している構造体型を確認しましょう。"

[E0560]
"消息模板" = "structにその名前のフィールドはありません"
"教学提示" = "構造体の初期化で存在しないフィールドを指定しました。構造体定義と使用フィールドを確認しましょう。"

[E0574]
"消息模板" = "structまたはenumの名前を期待"
"教学提示" = "ここでは値や式ではなく型名が必要です。構文を確認しましょう。"

[E0594]
"消息模板" = "不変変数に代入できません"
"教学提示" = "`宣言` で宣言した変数はデフォルトで不変です。変更したい場合は `宣言 可変` を使いましょう。"

[E0596]
"消息模板" = "可変として宣言されていないため可変借用できません"
"教学提示" = "可変借用（`可変参照`）できるのは可変変数のみです。変数を `宣言 可変` で宣言するか、パラメータに `可変` を付けましょう。"

[E0597]
"消息模板" = "借用した値の寿命が十分でありません"
"教学提示" = "参照の寿命が参照先の値の寿命を超えています。参照先の値がより長く生きるようにスコープを調整しましょう。"

[E0599]
"消息模板" = "この型にはその名前のメソッドがありません"
"教学提示" = "呼び出したメソッドがこの型に存在しません。メソッド名の綴りを確認するか、提供するトレイトをインポートしましょう。"

[E0603]
"消息模板" = "モジュールは非公開です"
"教学提示" = "モジュールはデフォルトで非公開です。外部からアクセスするには `公開 モジュール xxx;` で宣言しましょう。"

[E0610]
"消息模板" = "型にフィールドがありません"
"教学提示" = "アクセスしようとした型にフィールドがありません。誤った型を逆参照していないか確認しましょう。"

[E0614]
"消息模板" = "この型を逆参照できません"
"教学提示" = "`参照`（&）または Deref トレイトを実装する型だけが `逆参照` で逆参照できます。"

[E0618]
"消息模板" = "関数を期待、関数でないものを検出"
"教学提示" = "呼び出し構文 `xxx()` は xxx が関数またはクロージャである必要があります。変数を関数として呼んでいないか確認しましょう。"

[E0621]
"消息模板" = "明示的なライフタイムが必要です"
"教学提示" = "戻り値参照と引数参照の関係には明示的な注釈が必要です。関数にライフタイムパラメータを追加しましょう。"

[E0624]
"消息模板" = "フィールドまたはメソッドは非公開です"
"教学提示" = "構造体のフィールドはデフォルトで非公開です。フィールドに `公開` を付けるか、公開アクセサメソッドを提供しましょう。"

# ============================================
# その他（E06xx/E07xx）
# ============================================

[E0658]
"消息模板" = "不安定なライブラリ機能の使用"
"教学提示" = "この機能は現在のRustバージョンではまだ安定していません。`#![feature(...)]` が有効か確認するか、安定した代替手段を使いましょう。"

[E0716]
"消息模板" = "借用中に一時的な値が破棄されました"
"教学提示" = "一時的な値への参照は文をまたいで使用できません。値を先に変数に束縛してから参照を取りましょう。"

[E0759]
"消息模板" = "ライフタイムパラメータが不一致の境界で制約されています"
"教学提示" = "型のライフタイム境界が関数のライフタイム宣言と一致しません。ライフタイム注釈を統一しましょう。"
