# i18n-rust جدول مطابقة الكلمات المفتاحية (العربية)
# الصيغة: الاسم العربي = "الاسم الإنجليزي"

# ============================================
# كلمات التصريح
# ============================================
["声明"]
"دالة" = "fn"
"دع" = "let"
"متغير" = "mut"
"ثابت" = "const"
"استاتيكي" = "static"
"هيكل" = "struct"
"تعداد" = "enum"
"نوع" = "type"
"سمة" = "trait"
"تنفيذ" = "impl"
"وحدة" = "mod"
"عام" = "pub"
"صندوق" = "crate"
"فوق" = "super"
"خارجي" = "extern"
"استخدم" = "use"
"كـ" = "as"
"رئيسي" = "main"
# ============================================
# كلمات التحكم في التدفق
# ============================================
["控制流"]
"إذا" = "if"
"وإلا" = "else"
"طابق" = "match"
"حلقة" = "loop"
"بينما" = "while"
"لكل" = "for"
"في" = "in"
"اكسر" = "break"
"تابع" = "continue"
"أعد" = "return"

# ============================================
# الأنواع
# ============================================
["类型"]
"صحيح" = "i32"
"صحيح_طويل" = "i64"
"صحيح_قصير" = "i16"
"صحيح_مصغر" = "i8"
"طبيعي" = "u32"
"طبيعي_طويل" = "u64"
"طبيعي_قصير" = "u16"
"طبيعي_مصغر" = "u8"
"عائم" = "f64"
"عائم_قصير" = "f32"
"نص" = "str"
"بايت" = "u8"
"حرف" = "char"
"منطقي" = "bool"
"سلسلة" = "String"
"مرجع_سلسلة" = "&str"
"مصفوفة" = "Vec"
"قاموس" = "HashMap"
"خيار" = "Option"
"بعض" = "Some"
"لا_شيء" = "None"
"نتيجة" = "Result"
"نجاح" = "Ok"
"خطأ" = "Err"
"علبة" = "Box"

# ============================================
# القيم المنطقية
# ============================================
["逻辑值"]
"حقيقي" = "true"
"خاطئ" = "false"

# ============================================
# قيم خاصة
# ============================================
["特殊值"]
"فارغ" = "()"
"نفسه" = "self"
"الذات" = "Self"

# ============================================
# الذاكرة والمراجع
# ============================================
["内存"]
"مرجع" = "&"
"مرجع_متغير" = "&mut"
"إلغاء_المرجع" = "*"
"انقل" = "move"
"علبة" = "Box"

# ============================================
["不安全"]
"غير_آمن" = "unsafe"
"غير_متزامن" = "async"
"انتظر" = "await"
"ديناميكي" = "dyn"

# ============================================
["错误处理"]
"نتيجة" = "Result"
"خيار" = "Option"
"بعض" = "Some"
"لا_شيء" = "None"
"نجاح" = "Ok"
"خطأ" = "Err"

# ============================================
["宏"]
"صيغة" = "format"
"اطبع_سطرا" = "println"
"اطبع" = "print"
"اطبع_خطأ_سطرا" = "eprintln"
"اطبع_خطأ" = "eprint"
"أكد" = "assert"
"أكد_تساوي" = "assert_eq"
"أكد_اختلاف" = "assert_ne"
"غير_منفذ" = "unimplemented"
"لاحقا" = "todo"
"لا_يمكن_الوصول" = "unreachable"
"ذعر" = "panic"
"مصفوفة" = "vec"
"اكتب_سطرا" = "writeln"
"اكتب" = "write"
"أدرج" = "include"
"أدرج_نصا" = "include_str"
"أدرج_بايتات" = "include_bytes"
"نصي" = "stringify"
"عمود" = "column"
"ملف" = "file"
"سطر" = "line"
