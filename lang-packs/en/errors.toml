"教学提示" = "You cannot implement the same trait twice for a type. Check for overlapping implementations."

[E0116]
"消息模板" = "cannot define an inherent method with the same name as an inherent method in a different impl block"
"教学提示" = "Rename the method or merge the impl blocks."

[E0061]
