"教学提示" = "Check if the variable type matches what the context requires. Try using `as` for type casting."

[E0433]
"消息模板" = "failed to resolve: use of undeclared type `{名称}`"
"教学提示" = "Make sure you have imported the required module or type. Use the `use` keyword to import."

[E0384]
