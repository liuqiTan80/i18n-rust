"教学提示" = "Check the function signature and provide the correct number of arguments."

[E0282]
"消息模板" = "type annotations needed"
"教学提示" = "The compiler cannot infer the type. Add explicit type annotations, e.g., `let x: i32 = 5;`."

[E0596]
"消息模板" = "cannot borrow `{名称}` as mutable, as it is not declared as mutable"
"教学提示" = "Add `mut` to the variable binding: `let mut {名称} = ...;`"

[E0597]
"消息模板" = "cannot borrow `{名称}` as mutable"
"教学提示" = "The variable may be immutably borrowed at this point. Check the borrow scope."

[E0716]
"消息模板" = "temporary value dropped while borrowed"
"教学提示" = "Store the temporary value in a variable before borrowing it: `let temp = ...; let r = &temp;`"

[E0515]
"消息模板" = "returns a value referencing data owned by the current function"
