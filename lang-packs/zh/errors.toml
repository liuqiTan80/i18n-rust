# 错误消息翻译文件
# 格式：[错误码] + "消息模板" + "教学提示"

[E0308]
"消息模板" = "类型不匹配：期望 `{期望}`，实际得到 `{实际}`"
"教学提示" = "请检查变量类型是否与上下文要求一致。尝试使用 `作为` 进行类型转换。"

[E0433]
"消息模板" = "未找到类型 `{名称}`"
"教学提示" = "请确认是否已导入所需的模块或类型。可使用 `使用` 关键字导入。"

[E0384]
"消息模板" = "不可变变量 `{变量名}` 被重复赋值"
"教学提示" = "如果需要修改变量的值，请使用 `让 可变` 声明变量。"

[E0382]
"消息模板" = "值在移动后被使用：`{变量名}`"
"教学提示" = "Rust 中值被移动后不能再使用。考虑使用 `引用`（&）或 `克隆()` 来避免移动。"

[E0502]
"消息模板" = "无法借用 `{变量名}` 为可变，因为它同时也被不可变借用"
"教学提示" = "Rust 不允许同时存在可变借用和不可变借用。尝试缩小不可变借用的作用范围。"

[E0499]
"消息模板" = "无法多次可变借用 `{变量名}`"
"教学提示" = "同一时间只能有一个可变引用。这是 Rust 防止数据竞争的机制。"

[E0277]
"消息模板" = "类型 `{类型}` 未实现特征 `{特征}`"
"教学提示" = "请为该类型实现所需的特征，或使用已实现该特征的类型。"

[E0425]
"消息模板" = "找不到名称 `{名称}`"
"教学提示" = "请检查变量名是否拼写正确，或是否已在当前作用域中声明。"

[E0282]
"消息模板" = "无法推断类型，请添加类型标注"
"教学提示" = "Rust 编译器无法自动推断类型。请显式标注类型，例如 `让 x: i32 = 0;`。"

[E0601]
"消息模板" = "找不到 `main` 函数"
"教学提示" = "每个可执行 Rust 程序都需要一个 `main` 函数作为入口。请在代码中添加：函数 主函数() { ... }"

# ============================================
# 生命周期与借用（E01xx/E04xx/E05xx 系列）
# ============================================

[E0106]
"消息模板" = "函数缺少生命周期标注"
"教学提示" = "当函数有多个引用参数时，编译器无法推断引用之间的关系。请在参数和返回值上标注生命周期，例如：函数 最长<'a>(x: &'a 文本, y: &'a 文本) -> &'a 文本"

[E0107]
"消息模板" = "生命周期参数数量错误"
"教学提示" = "泛型或函数声明的生命周期参数数量与使用处不一致。请检查 `<>` 中的生命周期标注数量。"

[E0116]
"消息模板" = "无法为外部类型定义固有实现"
"教学提示" = "特征（实现）只能定义在本地类型上。可以为外部类型实现特征，但不能直接写 `实现` 块。"

[E0133]
"消息模板" = "不安全操作需要 unsafe 块"
"教学提示" = "解引用裸指针等操作必须在 `不安全` 块中进行，因为 Rust 无法保证这些操作的安全性。"

[E0204]
"消息模板" = "无法自动派生 Clone"
"教学提示" = "包含未实现 `克隆` 特征字段的类型无法派生克隆。请为字段类型手动实现 `克隆`。"

[E0210]
"消息模板" = "类型参数必须出现在所有泛型参数之前（孤儿规则）"
"教学提示" = "为外部类型实现外部特征时，必须保证特征或类型至少有一个是本地定义的，否则违反孤儿规则。"

[E0255]
"消息模板" = "名称已被用作泛型参数"
"教学提示" = "变量名不能与泛型参数名重复。请重命名变量或泛型参数。"

[E0271]
"消息模板" = "类型不匹配，无法满足特征约束"
"教学提示" = "实际类型与泛型约束不一致。请检查类型是否实现了所需的特征。"

[E0309]
"消息模板" = "泛型参数未满足特征约束"
"教学提示" = "泛型参数需要满足 `特征` 约束才能使用对应方法。请在泛型声明中添加特征约束。"

[E0310]
"消息模板" = "泛型参数未满足 Sized 约束"
"教学提示" = "泛型参数默认需要确定大小（Sized）。若使用未定大小的类型，请添加 `?Sized` 约束。"

# ============================================
# 类型与特征（E03xx/E04xx 系列）
# ============================================

[E0369]
"消息模板" = "类型不匹配：无法对 `{期望}` 和 `{实际}` 执行运算"
"教学提示" = "运算符两侧的类型必须兼容。请检查参与运算的变量类型是否一致，必要时使用 `作为` 转换。"

[E0373]
"消息模板" = "闭包可能借用临时值"
"教学提示" = "闭包捕获了临时值的引用，但闭包可能比临时值活得更久。请使用 `移动` 关键字或延长值的生命周期。"

[E0404]
"消息模板" = "期望特征，但发现的是类型"
"教学提示" = "`dyn` 或泛型约束处需要特征名称。请检查是否写错了名称。"

[E0407]
"消息模板" = "方法不是该特征（trait）的成员"
"教学提示" = "实现特征时只能定义特征声明的方法。请检查方法名是否与特征定义一致。"

[E0412]
"消息模板" = "无法找到类型"
"教学提示" = "使用的类型不存在或未导入。请使用 `使用` 关键字导入，或检查类型名拼写。"

[E0422]
"消息模板" = "无法找到结构体、枚举或联合体"
"教学提示" = "构造结构体时名称不存在。请检查结构体名拼写，或确认它已在当前作用域中定义。"

[E0432]
"消息模板" = "无法解析导入路径"
"教学提示" = "导入的模块或项不存在。请检查路径拼写，确认模块已声明（`模块 xxx;`）且可见。"

[E0435]
"消息模板" = "常量中不能使用非常量值"
"教学提示" = "`常量` 的值必须在编译时确定。函数调用等运行时值不能用于常量初始化，请改用 `静态` 或 `让`。"

[E0436]
"消息模板" = "函数定义重复"
"教学提示" = "同一作用域中不能定义同名函数。请检查是否有重复的 `函数 xxx()` 定义。"

[E0463]
"消息模板" = "找不到 crate"
"教学提示" = "外部包未安装或未在 Cargo.toml 的 [dependencies] 中声明。请先添加依赖。"

# ============================================
# 所有权与移动（E05xx 系列）
# ============================================

[E0496]
"消息模板" = "生命周期无法逃离其所属作用域"
"教学提示" = "引用的生命周期不能超过其指向值的生命周期。请检查数据的所有权结构。"

[E0505]
"消息模板" = "值在被借用期间被移动"
"教学提示" = "值存在引用时不能被移动。请先结束借用，或使用 `克隆()` 复制数据。"

[E0507]
"消息模板" = "无法移出借用内容"
"教学提示" = "不能把引用指向的值移动走。请使用 `克隆()`，或通过引用访问字段而不是整体移动。"

[E0508]
"消息模板" = "无法移出数组内容"
"教学提示" = "数组中的元素不能整体移出。可以使用索引 + `克隆()`，或将数组改为向量（`向量`）。"

[E0515]
"消息模板" = "无法返回局部变量的引用"
"教学提示" = "局部变量在函数结束时被销毁，不能返回它的引用。请返回所有权（值本身）或使用 `盒子`。"

[E0530]
"消息模板" = "匹配绑定与枚举变体冲突"
"教学提示" = "模式中的绑定名不能与枚举变体名相同。请重命名绑定变量。"

[E0539]
"消息模板" = "宏参数数量错误"
"教学提示" = "调用宏时参数个数与宏定义不符。请检查宏的使用方式。"

[E0559]
"消息模板" = "字段不存在"
"教学提示" = "结构体没有该字段。请检查字段名拼写，或确认使用的结构体类型正确。"

[E0560]
"消息模板" = "结构体没有该字段"
"教学提示" = "初始化结构体时指定了不存在的字段。请检查结构体定义与实际使用的字段。"

[E0574]
"消息模板" = "期望结构体或枚举名称"
"教学提示" = "此处需要一个类型名而非值或表达式。请检查语法。"

[E0594]
"消息模板" = "无法对不可变变量赋值"
"教学提示" = "`让` 声明的变量默认不可变。如需修改，请使用 `让 可变` 声明。"

[E0596]
"消息模板" = "无法借用为可变"
"教学提示" = "只有可变变量才能被可变借用（`&mut`）。请将变量声明为 `让 可变`，或将参数声明为 `可变`。"

[E0597]
"消息模板" = "借用内容未存活足够久"
"教学提示" = "引用的生命周期超过了被引用值的生命周期。请调整作用域，让被引用值存活更久。"

[E0599]
"消息模板" = "类型上找不到该方法"
"教学提示" = "调用的方法在该类型上不存在。请检查方法名拼写，或确认需要导入对应的特征（trait）。"

[E0603]
"消息模板" = "模块是私有的"
"教学提示" = "默认情况下模块是私有的。若需从外部访问，请使用 `公开 模块 xxx;` 声明。"

[E0610]
"消息模板" = "类型没有字段"
"教学提示" = "尝试访问的类型不包含任何字段。请检查是否解引用了错误的类型。"

[E0614]
"消息模板" = "无法解引用该类型"
"教学提示" = "只有引用（`&`）或实现了解引用特征的类型才能使用 `*` 解引用。"

[E0618]
"消息模板" = "期望函数，但此处不是函数"
"教学提示" = "调用语法 `xxx()` 要求 xxx 是函数或闭包。请检查是否把变量当作函数调用。"

[E0621]
"消息模板" = "生命周期不匹配，需要显式生命周期标注"
"教学提示" = "返回值引用与参数引用的关系需要显式标注。请为函数添加生命周期参数。"

[E0624]
"消息模板" = "字段或方法是私有的"
"教学提示" = "结构体字段默认私有。请为字段添加 `公开` 修饰，或提供公开的访问方法。"

# ============================================
# 其他（E06xx/E07xx 系列）
# ============================================

[E0658]
"消息模板" = "使用了不稳定的特性"
"教学提示" = "该特性在当前的 Rust 版本中尚未稳定。请检查是否启用了 `#![特性(...)]`，或使用稳定替代方案。"

[E0716]
"消息模板" = "临时值在语句结束前被丢弃"
"教学提示" = "临时创建的值的引用不能跨语句使用。请先将值绑定到变量再取引用。"

[E0759]
"消息模板" = "生命周期参数受限于不匹配的约束"
"教学提示" = "类型中的生命周期与函数声明的生命周期约束不一致。请统一生命周期标注。"