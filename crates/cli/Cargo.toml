[package]
name = "rzc"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
description = "多语言 Rust 教学方言编译器，支持用母语编写 Rust 程序"
license = "MIT"
repository = "https://gitcode.com/tan80/zrRust"
homepage = "https://github.com/liuqiTan80/i18n-rust"
readme = "README.md"
keywords = ["rust", "i18n", "chinese", "teaching", "transpiler"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# 内部引擎（发布时 path 自动转为 crates.io 版本依赖，故必须显式声明版本）
i18n-rust-engine = { path = "../engine", version = "0.7.0" }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
# 非 ASCII 模块声明 #[path] 注解（与引擎同版本，避免 E0754）
rustc_lexer.workspace = true
# 远程语言包安装：curl 下载 ZIP 压缩包后的解压
zip = "2"
# mapping auto 的 AI 调用：轻量同步 HTTP 客户端（rustls 0.23 特性避免系统 OpenSSL 依赖；
# 升级 3.x 同步修复 rustls-webpki 0.101 的 RUSTSEC-2026-0098/0099/0104）
ureq = { version = "3", features = ["rustls"] }
# 内置工具链安装：临时目录 + tar.gz 解压（standalone rustc/cargo）+ 下载哈希校验
tempfile.workspace = true
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
# 子命令冒烟测试：进程级断言（版本号 / 内置语言包 / 转译端到端）
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true

[lints]
workspace = true
