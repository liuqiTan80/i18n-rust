[package]
name = "i18n-rust-engine"
version = "0.6.1"
edition = "2024"
description = "多语言 Rust 教学方言核心引擎：词法转译、映射管理、诊断翻译、增量缓存"
license = "MIT"
repository = "https://gitcode.com/tan80/zrRust"
keywords = ["rust", "i18n", "chinese", "teaching", "transpiler"]
categories = ["development-tools", "compilers"]

# 内置语言包目录：编译期经 include_str! 嵌入，发布时随 crate 打包
# 注意：include 是白名单，必须显式包含 src/** 与 build.rs
include = ["lang-packs/**", "src/**", "build.rs", "Cargo.toml"]
build = "build.rs"

[dependencies]
rustc_lexer = "0.1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"

