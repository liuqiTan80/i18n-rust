# خريطة مكتبة طرف ثالث مولدة تلقائيا
# crate: salvo
# الشروحات في هذا الملف مولدة تلقائيا بالذكاء الاصطناعي بناء على أسماء وتواقيع الواجهة البرمجية، وليست ترجمة للتوثيق الرسمي للحزمة الأصلية، وهي للاطلاع الدراسي فقط. حقوق النشر للحزمة الأصلية تعود لمؤلفيها.
# محسنة يدويا: ترجمة المعرفات إلى العربية مع إضافة الشروحات.

