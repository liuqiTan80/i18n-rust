# ملف ترجمة رسائل الأخطاء (العربية)
# الصيغة: [رمز الخطأ] + "消息模板" (قالب الرسالة) + "教学提示" (تلميح تعليمي)
# العلامات {期望} {实际} {名称} {变量名} {类型} {特征} يستبدلها المترجم.

[E0308]
"消息模板" = "أنواع غير متوافقة: كان متوقعا `{期望}`, تم الحصول على `{实际}`"
"教学提示" = "تحقق من أن نوع المتغير يطابق ما يطلبه السياق. حاول تحويل النوع باستخدام `كـ`."

[E0433]
"消息模板" = "النوع `{名称}` غير موجود"
"教学提示" = "تأكد من أن الوحدة أو النوع المطلوب مستورد. يمكنك استيراده بالكلمة المفتاحية `استخدم`."

[E0384]
"消息模板" = "لا يمكن الإسناد مرتين إلى المتغير غير القابل للتغيير `{变量名}`"
"教学提示" = "إذا كنت بحاجة إلى تغيير قيمة متغير، أعلنه بـ `دع متغير`."

[E0382]
"消息模板" = "استخدام القيمة بعد نقلها: `{变量名}`"
"教学提示" = "في رست، القيمة المنقولة لا يمكن استخدامها بعد الآن. استخدم `مرجع` (&) أو `استنسخ()` لتجنب النقل."

[E0502]
"消息模板" = "لا يمكن إعارة `{变量名}` كمرجع متغير: إنه معار بالفعل كمرجع غير متغير"
"教学提示" = "رست لا يسمح بإعارات متغيرة وغير متغيرة في نفس الوقت. قلل نطاق الإعارة غير المتغيرة."

[E0499]
"消息模板" = "لا يمكن إعارة `{变量名}` كمرجع متغير عدة مرات"
"教学提示" = "يمكن أن يوجد مرجع متغير واحد فقط في كل مرة. هذه آلية رست لتجنب سباقات البيانات."

[E0277]
"消息模板" = "النوع `{类型}` لا ينفذ السمة `{特征}`"
"教学提示" = "نفذ السمة المطلوبة للنوع، أو استخدم نوعا ينفذها بالفعل."

[E0425]
"消息模板" = "الاسم `{名称}` غير موجود في هذا النطاق"
"教学提示" = "تحقق من كتابة اسم المتغير بشكل صحيح ومن إعلانه في النطاق الحالي."

[E0282]
"消息模板" = "لا يمكن استنتاج النوع, أضف تعليقا توضيحيا للنوع"
"教学提示" = "لا يستطيع المترجم استنتاج النوع تلقائيا. حدد النوع صراحة, مثلا: `دع س: صحيح = 0;`"

[E0601]
"消息模板" = "الدالة `رئيسي` غير موجودة في الصندوق"
"教学提示" = "كل برنامج رست قابل للتنفيذ يحتاج دالة `رئيسي` كنقطة دخول. أضف في الكود: دالة رئيسي() { ... }"

# ============================================
# دورات الحياة والإعارات (سلسلة E01xx/E04xx/E05xx)
# ============================================

[E0106]
"消息模板" = "تنقص تعليقات دورة الحياة في الدالة"
"教学提示" = "عندما تحتوي الدالة على عدة معاملات مرجعية، لا يستطيع المترجم استنتاج علاقتها. أضف تعليقات دورة الحياة في المعاملات والقيمة المرجعة, مثلا: دالة أطول<'a>(س: &'a نص, ص: &'a نص) -> &'a نص"

[E0107]
"消息模板" = "عدد معاملات دورة الحياة غير صحيح"
"教学提示" = "عدد معاملات دورة الحياة في التصريح لا يطابق الاستخدام. تحقق من التعليقات داخل `<>`."

[E0116]
"消息模板" = "لا يمكن تعريف تنفيذ ذاتي لنوع خارجي"
"教学提示" = "كتل `تنفيذ` الذاتية يمكن تعريفها للأنواع المحلية فقط. للأنواع الخارجية يمكنك تنفيذ السمات، لكن لا يمكنك كتابة كتلة `تنفيذ` مباشرة."

[E0133]
"消息模板" = "العملية غير الآمنة تتطلب كتلة غير آمنة"
"教学提示" = "عمليات مثل إلغاء مرجع المؤشرات الخام يجب أن تتم داخل كتلة `غير_آمن`, لأن رست لا يمكنه ضمان أمانها."

[E0204]
"消息模板" = "لا يمكن اشتقاق Clone تلقائيا"
"教学提示" = "الأنواع التي تحتوي حقولا لا تنفذ `قابل_للاستنساخ` لا يمكنها اشتقاق الاستنساخ. نفذ `قابل_للاستنساخ` يدويا لنوع الحقل."

[E0210]
"消息模板" = "يجب أن يسبق معامل النوع جميع الأنواع المحلية (قاعدة اليتيم)"
"教学提示" = "عند تنفيذ سمة خارجية لنوع خارجي, يجب أن تكون السمة أو النوع محليا على الأقل; وإلا تنتهك قاعدة اليتيم."

[E0255]
"消息模板" = "الاسم مستخدم بالفعل كمعامل عام"
"教学提示" = "لا يمكن أن يطابق اسم المتغير اسم معامل عام. أعد تسمية المتغير أو المعامل."

[E0271]
"消息模板" = "أنواع غير متوافقة: لم يتم استيفاء قيد السمة"
"教学提示" = "النوع الفعلي لا يستوفي قيود النوع العام. تحقق مما إذا كان النوع ينفذ السمة المطلوبة."

[E0309]
"消息模板" = "معامل النوع العام لا يستوفي قيد السمة"
"教学提示" = "يجب أن يستوفي معامل النوع العام القيد `{特征}` لاستخدام الطرق المقابلة. أضف القيد في تصريح النوع العام."

[E0310]
"消息模板" = "معامل النوع العام لا يستوفي قيد Sized"
"教学提示" = "يجب أن يكون لمعاملات النوع العام حجم معروف (`حجم_ثابت`) افتراضيا. للأنواع بدون حجم, أضف القيد `?حجم_ثابت`."

# ============================================
# الأنواع والسمات (سلسلة E03xx/E04xx)
# ============================================

[E0369]
"消息模板" = "أنواع غير متوافقة: لا يمكن العمل مع `{期望}` و `{实际}`"
"教学提示" = "يجب أن يكون النوعان على جانبي المعامل متوافقين. تحقق من تطابق المعاملات, وإذا لزم الأمر قم بالتحويل بـ `كـ`."

[E0373]
"消息模板" = "الإغلاق قد يبقى بعد القيمة المؤقتة المعارة"
"教学提示" = "يلتقط الإغلاق مرجعا إلى قيمة مؤقتة وقد يعيش أطول منها. استخدم الكلمة المفتاحية `انقل` أو أطل دورة حياة القيمة."

[E0404]
"消息模板" = "كان متوقعا سمة, لكن تم العثور على نوع"
"教学提示" = "في مكان `ديناميكي` أو قيد عام يلزم اسم سمة. تحقق مما إذا كنت كتبت الاسم بشكل خاطئ."

[E0407]
"消息模板" = "الطريقة ليست عضوا في هذه السمة"
"教学提示" = "عند تنفيذ سمة يمكنك فقط تعريف الطرق التي تعلنها. تحقق من أن اسم الطريقة يطابق تعريف السمة."

[E0412]
"消息模板" = "لا يمكن العثور على النوع"
"教学提示" = "النوع المستخدم غير موجود أو غير مستورد. استورده بـ `استخدم` أو راجع الإملاء."

[E0422]
"消息模板" = "لا يمكن العثور على الهيكل أو التعداد أو الاتحاد"
"教学提示" = "اسم بناء الهيكل غير موجود. تحقق من الإملاء أو من تعريفه في النطاق الحالي."

[E0432]
"消息模板" = "لا يمكن حل مسار الاستيراد"
"教学提示" = "الوحدة أو العنصر المستورد غير موجود. راجع المسار وتأكد من أن الوحدة معلنة (`وحدة xxx;`) ومرئية."

[E0435]
"消息模板" = "تم استخدام قيمة غير ثابتة داخل ثابت"
"教学提示" = "يجب أن تكون قيمة `ثابت` معروفة في وقت الترجمة. قيم التنفيذ (استدعاءات الدوال) لا تصلح لتهيئة الثوابت; استخدم `استاتيكي` أو `دع`."

[E0436]
"消息模板" = "تعريف مكرر للدالة"
"教学提示" = "لا يمكن تعريف دالتين بنفس الاسم في نفس النطاق. راجع التعريفات المكررة لـ `دالة xxx()`."

[E0463]
"消息模板" = "الصندوق غير موجود"
"教学提示" = "الصندوق الخارجي غير مثبت أو غير معلن في [dependencies] بملف Cargo.toml. أضف التبعية أولا."

# ============================================
# الملكية والنقل (سلسلة E05xx)
# ============================================

[E0496]
"消息模板" = "دورة الحياة لا يمكنها الهروب من نطاقها"
"教学提示" = "لا يمكن أن تتجاوز دورة حياة المرجع دورة حياة القيمة التي يشير إليها. راجع بنية ملكية البيانات."

[E0505]
"消息模板" = "تم نقل القيمة بينما كانت معارة"
"教学提示" = "طالما توجد مراجع إلى قيمة, لا يمكن نقلها. أنهِ الإعارة أولا أو استخدم `استنسخ()` لنسخ البيانات."

[E0507]
"消息模板" = "لا يمكن نقل محتوى مرجع"
"教学提示" = "لا يمكن نقل القيمة التي يشير إليها مرجع. استخدم `استنسخ()` أو قم بالوصول إلى الحقول بالمرجع بدلا من نقل كل شيء."

[E0508]
"消息模板" = "لا يمكن نقل محتوى مصفوفة"
"教学提示" = "عناصر المصفوفة لا يمكن نقلها إلى الخارج. استخدم الفهرس + `استنسخ()` أو حوّل المصفوفة إلى متجه (`مصفوفة`)."

[E0515]
"消息模板" = "لا يمكن إرجاع مرجع إلى متغير محلي"
"教学提示" = "المتغير المحلي يُدمر عند انتهاء الدالة, لذلك لا يمكن إرجاع مرجعه. أعد القيمة (الملكية) أو استخدم `علبة`."

[E0530]
"消息模板" = "ربط المطابقة يخفي متغير نوع التعداد"
"教学提示" = "لا يمكن أن يطابق اسم الربط في النمط اسم متغير تعداد. أعد تسمية متغير الربط."

[E0539]
"消息模板" = "عدد وسائط الماكرو غير صحيح"
"教学提示" = "عدد الوسائط عند استدعاء الماكرو لا يطابق تعريفه. راجع استخدام الماكرو."

[E0559]
"消息模板" = "الحقل غير موجود"
"教学提示" = "الهيكل لا يحتوي على هذا الحقل. تحقق من إملاء الاسم أو نوع الهيكل المستخدم."

[E0560]
"消息模板" = "الهيكل لا يحتوي على هذا الحقل"
"教学提示" = "عند تهيئة الهيكل تم تحديد حقل غير موجود. راجع تعريف الهيكل والحقول المستخدمة."

[E0574]
"消息模板" = "كان متوقعا اسم هيكل أو تعداد"
"教学提示" = "هنا يلزم اسم نوع, وليس قيمة أو تعبيرا. راجع بناء الجملة."

[E0594]
"消息模板" = "لا يمكن الإسناد إلى متغير غير قابل للتغيير"
"教学提示" = "المتغيرات المعلنة بـ `دع` غير قابلة للتغيير افتراضيا. لتعديلها استخدم `دع متغير`."

[E0596]
"消息模板" = "لا يمكن الإعارة كمرجع متغير"
"教学提示" = "فقط المتغيرات القابلة للتغيير يمكن إعارتها كمرجع متغير (`مرجع_متغير`). أعلن المتغير بـ `دع متغير` أو حدد المعامل كـ `متغير`."

[E0597]
"消息模板" = "القيمة المعارة لا تعيش طويلا بما يكفي"
"教学提示" = "دورة حياة المرجع تتجاوز دورة حياة القيمة المشار إليها. اضبط النطاقات ليعيش المرجع أطول."

[E0599]
"消息模板" = "النوع لا يحتوي على طريقة بهذا الاسم"
"教学提示" = "الطريقة المستدعاة غير موجودة في هذا النوع. راجع الإملاء أو استورد السمة التي توفر الطريقة."

[E0603]
"消息模板" = "الوحدة خاصة"
"教学提示" = "افتراضيا الوحدات خاصة. للوصول من الخارج أعلنها بـ `عام وحدة xxx;`."

[E0610]
"消息模板" = "النوع لا يحتوي على حقول"
"教学提示" = "النوع الذي تحاول الوصول إليه لا يحتوي حقولا. تحقق من أنك لا تلغي مرجع النوع الخاطئ."

[E0614]
"消息模板" = "لا يمكن إلغاء مرجع هذا النوع"
"教学提示" = "فقط المراجع (`مرجع` — &) أو الأنواع التي تنفذ سمة `قابل_لإلغاء_المرجع` (Deref) يمكن إلغاء مرجعها بـ `إلغاء_المرجع` (*)."

[E0618]
"消息模板" = "كان متوقعا دالة, لكن هذا ليس دالة"
"教学提示" = "بناء جملة الاستدعاء `xxx()` يتطلب أن يكون xxx دالة أو إغلاقا. تحقق من أنك لا تستدعي متغيرا كدالة."

[E0621]
"消息模板" = "دورة حياة غير متوافقة, يلزم تعليق صريح"
"教学提示" = "العلاقة بين مرجع الإرجاع ومراجع المعاملات تتطلب تعليقا صريحا. أضف معامل دورة حياة إلى الدالة."

[E0624]
"消息模板" = "الحقل أو الطريقة خاصة"
"教学提示" = "حقول الهيكل خاصة افتراضيا. أضف `عام` إلى الحقل أو وفر طريقة وصول عامة."

# ============================================
# أخرى (سلسلة E06xx/E07xx)
# ============================================

[E0658]
"消息模板" = "استخدام ميزة غير مستقرة"
"教学提示" = "هذه الميزة ليست مستقرة بعد في إصدار رست الحالي. تحقق مما إذا كان `#![feature(...)]` مفعلا أو استخدم بديلا مستقرا."

[E0716]
"消息模板" = "تم تدمير القيمة المؤقتة قبل إنهاء الجملة"
"教学提示" = "مرجع إلى قيمة تم إنشاؤها مؤقتا لا يمكن استخدامه خارج الجملة. اربط القيمة أولا بمتغير ثم خذ المرجع."

[E0759]
"消息模板" = "معامل دورة الحياة مقيد بحد غير متوافق"
"教学提示" = "حدود دورة حياة النوع لا تطابق تصريح الدالة. وحد تعليقات دورة الحياة."
