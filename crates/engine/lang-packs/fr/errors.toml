# Fichier de traduction des messages d'erreur (français)
# Format : [code d'erreur] + "消息模板" (modèle du message) + "教学提示" (astuce pédagogique)
# Les marqueurs {期望} {实际} {名称} {变量名} {类型} {特征} sont remplacés par le compilateur.

[E0308]
"消息模板" = "Incompatibilité de types : attendu `{期望}`, trouvé `{实际}`"
"教学提示" = "Vérifiez si le type de la variable correspond au contexte. Essayez de convertir le type avec `comme`."

[E0433]
"消息模板" = "Type `{名称}` introuvable"
"教学提示" = "Vérifiez que le module ou le type requis est importé. Vous pouvez importer avec le mot-clé `utiliser`."

[E0384]
"消息模板" = "Impossible d'assigner deux fois la variable immuable `{变量名}`"
"教学提示" = "Si vous devez modifier la valeur d'une variable, déclarez-la avec `laisser mutable`."

[E0382]
"消息模板" = "Utilisation de la valeur après son déplacement : `{变量名}`"
"教学提示" = "En Rust, une valeur déplacée ne peut plus être utilisée. Utilisez `reference` (&) ou `cloner()` pour éviter le déplacement."

[E0502]
"消息模板" = "Impossible d'emprunter `{变量名}` comme mutable : il est déjà emprunté comme immuable"
"教学提示" = "Rust n'autorise pas les emprunts mutable et immuable simultanés. Réduisez la portée de l'emprunt immuable."

[E0499]
"消息模板" = "Impossible d'emprunter `{变量名}` comme mutable plusieurs fois"
"教学提示" = "Une seule référence mutable peut exister à la fois. C'est le mécanisme de Rust contre les courses aux données."

[E0277]
"消息模板" = "Le type `{类型}` n'implémente pas le trait `{特征}`"
"教学提示" = "Implémentez le trait requis pour ce type, ou utilisez un type qui l'implémente déjà."

[E0425]
"消息模板" = "Nom `{名称}` introuvable dans cette portée"
"教学提示" = "Vérifiez l'orthographe du nom de la variable et qu'elle est déclarée dans la portée actuelle."

[E0282]
"消息模板" = "Impossible d'inférer le type, ajoutez une annotation de type"
"教学提示" = "Le compilateur ne peut pas inférer le type automatiquement. Indiquez le type explicitement, par exemple : `laisser x: entier = 0;`"

[E0601]
"消息模板" = "Fonction `principale` introuvable dans la caisse"
"教学提示" = "Tout programme Rust exécutable a besoin d'une fonction `principale` comme point d'entrée. Ajoutez dans le code : fonction principale() { ... }"

# ============================================
# Durées de vie et emprunts (séries E01xx/E04xx/E05xx)
# ============================================

[E0106]
"消息模板" = "Il manque une annotation de durée de vie à la fonction"
"教学提示" = "Quand une fonction a plusieurs paramètres de référence, le compilateur ne peut pas déduire leur relation. Ajoutez des annotations de durée de vie aux paramètres et à la valeur de retour, par exemple : fonction plusLongue<'a>(x: &'a texte, y: &'a texte) -> &'a texte"

[E0107]
"消息模板" = "Nombre incorrect de paramètres de durée de vie"
"教学提示" = "Le nombre de paramètres de durée de vie dans la déclaration ne correspond pas à l'utilisation. Vérifiez les annotations dans `<>`."

[E0116]
"消息模板" = "Impossible de définir une implémentation inhérente pour un type externe"
"教学提示" = "Les blocs `implementation` inhérents ne peuvent être définis que pour des types locaux. Pour un type externe, vous pouvez implémenter un trait, mais pas écrire de bloc `implementation` direct."

[E0133]
"消息模板" = "L'opération dangereuse nécessite un bloc unsafe"
"教学提示" = "Les opérations comme la déréférence de pointeurs bruts doivent se faire dans un bloc `dangereux`, car Rust ne peut pas garantir leur sécurité."

[E0204]
"消息模板" = "Impossible de dériver automatiquement Clone"
"教学提示" = "Les types contenant des champs qui n'implémentent pas `clonable` ne peuvent pas dériver le clonage. Implémentez `clonable` manuellement pour le type du champ."

[E0210]
"消息模板" = "Le paramètre de type doit précéder tous les types locaux (règle de l'orphelin)"
"教学提示" = "Pour implémenter un trait externe sur un type externe, au moins le trait ou le type doit être local, sinon la règle de l'orphelin est violée."

[E0255]
"消息模板" = "Le nom est déjà utilisé comme paramètre générique"
"教学提示" = "Le nom d'une variable ne peut pas correspondre à un paramètre générique. Renommez la variable ou le paramètre."

[E0271]
"消息模板" = "Incompatibilité de types : la contrainte du trait n'est pas satisfaite"
"教学提示" = "Le type réel ne satisfait pas les contraintes du générique. Vérifiez que le type implémente le trait requis."

[E0309]
"消息模板" = "Le paramètre générique ne satisfait pas la contrainte du trait"
"教学提示" = "Le paramètre générique doit satisfaire la contrainte `{特征}` pour utiliser les méthodes correspondantes. Ajoutez la contrainte dans la déclaration du générique."

[E0310]
"消息模板" = "Le paramètre générique ne satisfait pas la contrainte Sized"
"教学提示" = "Les paramètres génériques doivent avoir une taille connue (`taille_fixe`) par défaut. Pour les types sans taille, ajoutez la contrainte `?taille_fixe`."

# ============================================
# Types et traits (séries E03xx/E04xx)
# ============================================

[E0369]
"消息模板" = "Incompatibilité de types : impossible d'opérer sur `{期望}` et `{实际}`"
"教学提示" = "Les types des deux côtés de l'opérateur doivent être compatibles. Vérifiez que les opérandes correspondent, convertissez avec `comme` si nécessaire."

[E0373]
"消息模板" = "La fermeture peut survivre à la valeur temporaire empruntée"
"教学提示" = "La fermeture capture une référence à une valeur temporaire et peut vivre plus longtemps qu'elle. Utilisez le mot-clé `deplacer` ou prolongez la durée de vie de la valeur."

[E0404]
"消息模板" = "Attendu un trait, mais trouvé un type"
"教学提示" = "À l'endroit de `dynamique` ou d'une contrainte générique, il faut le nom d'un trait. Vérifiez l'orthographe du nom."

[E0407]
"消息模板" = "La méthode n'est pas membre de ce trait"
"教学提示" = "En implémentant un trait, vous ne pouvez définir que les méthodes qu'il déclare. Vérifiez que le nom de la méthode correspond à la définition du trait."

[E0412]
"消息模板" = "Impossible de trouver le type"
"教学提示" = "Le type utilisé n'existe pas ou n'est pas importé. Importez-le avec `utiliser` ou vérifiez l'orthographe."

[E0422]
"消息模板" = "Impossible de trouver la structure, l'énumération ou l'union"
"教学提示" = "Le nom pour construire la structure n'existe pas. Vérifiez l'orthographe ou qu'elle est définie dans la portée actuelle."

[E0432]
"消息模板" = "Impossible de résoudre le chemin d'importation"
"教学提示" = "Le module ou l'élément importé n'existe pas. Vérifiez le chemin et que le module est déclaré (`module xxx;`) et visible."

[E0435]
"消息模板" = "Valeur non constante utilisée dans une constante"
"教学提示" = "La valeur de `constante` doit être connue à la compilation. Les valeurs d'exécution (appels de fonctions) ne peuvent pas initialiser une constante ; utilisez `statique` ou `laisser`."

[E0436]
"消息模板" = "Définition de fonction dupliquée"
"教学提示" = "On ne peut pas définir deux fonctions du même nom dans la même portée. Vérifiez les définitions dupliquées de `fonction xxx()`."

[E0463]
"消息模板" = "Caisse introuvable"
"教学提示" = "Le paquet externe n'est pas installé ou n'est pas déclaré dans [dependencies] du Cargo.toml. Ajoutez d'abord la dépendance."

# ============================================
# Propriété et déplacement (série E05xx)
# ============================================

[E0496]
"消息模板" = "La durée de vie ne peut pas échapper à sa portée"
"教学提示" = "La durée de vie d'une référence ne peut pas dépasser celle de la valeur pointée. Vérifiez la structure de propriété des données."

[E0505]
"消息模板" = "La valeur a été déplacée pendant qu'elle était empruntée"
"教学提示" = "Tant que des références existent, la valeur ne peut pas être déplacée. Terminez d'abord l'emprunt ou utilisez `cloner()` pour copier les données."

[E0507]
"消息模板" = "Impossible de déplacer le contenu d'une référence"
"教学提示" = "On ne peut pas déplacer la valeur pointée par une référence. Utilisez `cloner()` ou accédez aux champs par référence au lieu de tout déplacer."

[E0508]
"消息模板" = "Impossible de déplacer le contenu d'un tableau"
"教学提示" = "Les éléments d'un tableau ne peuvent pas être déplacés hors de celui-ci. Utilisez l'index + `cloner()` ou convertissez le tableau en vecteur (`vecteur`)."

[E0515]
"消息模板" = "Impossible de retourner une référence à une variable locale"
"教学提示" = "La variable locale est détruite à la fin de la fonction, on ne peut donc pas retourner sa référence. Retournez la valeur (la propriété) ou utilisez `boite`."

[E0530]
"消息模板" = "La liaison du correspondre masque une variante d'énumération"
"教学提示" = "Le nom de liaison dans le motif ne peut pas correspondre à une variante d'énumération. Renommez la variable de liaison."

[E0539]
"消息模板" = "Nombre d'arguments de macro incorrect"
"教学提示" = "Le nombre d'arguments à l'appel de la macro ne correspond pas à sa définition. Vérifiez l'utilisation de la macro."

[E0559]
"消息模板" = "Le champ n'existe pas"
"教学提示" = "La structure n'a pas ce champ. Vérifiez l'orthographe du nom ou le type de structure utilisé."

[E0560]
"消息模板" = "La structure n'a pas ce champ"
"教学提示" = "L'initialisation de la structure a spécifié un champ inexistant. Vérifiez la définition de la structure et les champs utilisés."

[E0574]
"消息模板" = "Attendu un nom de structure ou d'énumération"
"教学提示" = "Ici, il faut un nom de type, pas une valeur ou une expression. Vérifiez la syntaxe."

[E0594]
"消息模板" = "Impossible d'assigner à une variable immuable"
"教学提示" = "Les variables déclarées avec `laisser` sont immuables par défaut. Pour les modifier, utilisez `laisser mutable`."

[E0596]
"消息模板" = "Impossible d'emprunter comme mutable"
"教学提示" = "Seules les variables mutables peuvent être empruntées comme mutables (`reference_mutable`). Déclarez la variable avec `laisser mutable` ou marquez le paramètre comme `mutable`."

[E0597]
"消息模板" = "La valeur empruntée ne vit pas assez longtemps"
"教学提示" = "La durée de vie de la référence dépasse celle de la valeur référencée. Ajustez les portées pour que la valeur vive plus longtemps."

[E0599]
"消息模板" = "Ce type n'a pas de méthode avec ce nom"
"教学提示" = "La méthode appelée n'existe pas sur ce type. Vérifiez l'orthographe ou importez le trait qui fournit la méthode."

[E0603]
"消息模板" = "Le module est privé"
"教学提示" = "Par défaut, les modules sont privés. Pour y accéder de l'extérieur, déclarez-le avec `publique module xxx;`."

[E0610]
"消息模板" = "Le type n'a pas de champs"
"教学提示" = "Le type auquel vous accédez ne contient pas de champs. Vérifiez que vous ne déréférencez pas le mauvais type."

[E0614]
"消息模板" = "Impossible de déréférencer ce type"
"教学提示" = "Seules les références (`reference` — &) ou les types implémentant le trait `dereferencable` (Deref) peuvent être déréférencés avec `dereference` (*)."

[E0618]
"消息模板" = "Attendu une fonction, mais ce n'est pas une fonction"
"教学提示" = "La syntaxe d'appel `xxx()` exige que xxx soit une fonction ou une fermeture. Vérifiez que vous n'appelez pas une variable comme une fonction."

[E0621]
"消息模板" = "Durée de vie incompatible, annotation explicite requise"
"教学提示" = "La relation entre la référence de retour et celles des paramètres exige une annotation explicite. Ajoutez un paramètre de durée de vie à la fonction."

[E0624]
"消息模板" = "Le champ ou la méthode est privé"
"教学提示" = "Les champs d'une structure sont privés par défaut. Ajoutez `publique` au champ ou fournissez une méthode d'accès publique."

# ============================================
# Autres (séries E06xx/E07xx)
# ============================================

[E0658]
"消息模板" = "Utilisation d'une fonctionnalité instable"
"教学提示" = "Cette fonctionnalité n'est pas encore stable dans la version actuelle de Rust. Vérifiez que `#![feature(...)]` est activé ou utilisez une alternative stable."

[E0716]
"消息模板" = "La valeur temporaire a été détruite avant la fin de l'instruction"
"教学提示" = "Une référence à une valeur temporaire ne peut pas être utilisée au-delà de l'instruction. Liez d'abord la valeur à une variable, puis prenez la référence."

[E0759]
"消息模板" = "Le paramètre de durée de vie est contraint par une limite incompatible"
"教学提示" = "Les limites de durée de vie du type ne correspondent pas à la déclaration de la fonction. Unifiez les annotations de durée de vie."

# ==================== Couverture complète de l'index officiel des erreurs (modèles en texte pur) ====================

[E0001]
"消息模板" = "ce bras de correspondance est inaccessible"
"教学提示" = "Les bras précédents couvrent déjà tous les cas possibles, ce bras ne sera jamais exécuté. Supprimez le bras superflu ou modifiez l'ordre."

[E0002]
"消息模板" = "correspondance vide impossible sur un type non vide"
"教学提示" = "Une expression de correspondance nécessite au moins un bras. Ajoutez des bras pour toutes les valeurs possibles."

[E0004]
"消息模板" = "l'expression de correspondance est incomplète : certaines valeurs possibles n'ont pas de bras"
"教学提示" = "La correspondance doit couvrir tous les cas possibles. Complétez les bras manquants ou ajoutez un bras générique `_`."

[E0005]
"消息模板" = "ce motif peut échouer, mais un motif infaillible est requis ici"
"教学提示" = "Les liaisons `laisser` et les paramètres de fonction exigent des motifs infaillibles. Utilisez `correspondre` ou `si laisser` pour les motifs faillibles."

[E0007]
"消息模板" = "(code d'erreur retiré) une valeur du motif est déplacée vers plusieurs endroits"
"教学提示" = "Une valeur ne peut être déplacée que vers une seule liaison. Ajustez la liaison ou utilisez des références."

[E0009]
"消息模板" = "(code d'erreur retiré) les valeurs non Copy du motif doivent être liées de manière uniforme"
"教学提示" = "Dans un même motif, toutes les valeurs n'implémentant pas `copier` (Copy) doivent être liées de façon identique (toutes déplacées ou toutes empruntées)."

[E0010]
"消息模板" = "(code d'erreur retiré) la valeur d'un élément statique doit être connue à la compilation"
"教学提示" = "Les valeurs de `statique` et `constante` doivent être connues à la compilation. Initialisez avec des expressions constantes."

[E0013]
"消息模板" = "(code d'erreur retiré) une constante ne peut pas référencer un élément statique"
"教学提示" = "`constante` peut référencer d'autres constantes mais pas des éléments `statique`. Lisez les statiques dans une fonction à la place."

[E0014]
"消息模板" = "(code d'erreur retiré) une constante ne peut être initialisée qu'avec des valeurs constantes"
"教学提示" = "L'initialisation d'une constante ne peut utiliser que des expressions constantes ou des appels de fonctions constantes. Simplifiez l'expression."

[E0015]
"消息模板" = "une fonction non constante est appelée dans un contexte constant"
"教学提示" = "Les initialisations de `constante`/`statique` et les longueurs de tableaux ne peuvent appeler que des fonctions constantes (`fonction constante`). Déclarez la fonction comme constante ou calculez à l'exécution."

[E0023]
"消息模板" = "le nombre de champs extraits de la variante d'énumération est incorrect"
"教学提示" = "Le nombre de champs d'un motif de variante tuple doit correspondre à la définition. Vérifiez la définition de la variante."

[E0025]
"消息模板" = "le même champ d'une structure est lié deux fois dans le motif"
"教学提示" = "Dans un motif de structure, chaque champ ne peut être lié qu'une fois. Supprimez la liaison dupliquée."

[E0026]
"消息模板" = "le motif de structure utilise un champ inexistant"
"教学提示" = "Vérifiez l'orthographe du nom de champ et confirmez dans la définition de la structure que le champ existe."

[E0027]
"消息模板" = "le motif de structure ne couvre pas tous les champs"
"教学提示" = "Un motif de structure doit mentionner chaque champ ou ignorer les autres avec `..` à la fin."

[E0029]
"消息模板" = "seuls les types avec comparaison d'ordre peuvent correspondre à une plage"
"教学提示" = "La syntaxe de plage ne prend en charge que les types comme les entiers et caractères implémentant `ordre_partiel`. Pour les types personnalisés, utilisez une condition de garde (`si` après le bras)."

[E0030]
"消息模板" = "le début de la plage est supérieur à la fin, la plage est vide"
"教学提示" = "Un motif de plage inclut les deux bornes, le début ne peut pas dépasser la fin. Échangez les bornes ou corrigez les valeurs."

[E0033]
"消息模板" = "un type objet trait ne peut pas être déréférencé directement"
"教学提示" = "Les objets trait (`dynamique trait`) ne peuvent pas être déréférencés. Appelez les méthodes via une référence ou utilisez un type concret."

[E0034]
"消息模板" = "l'appel de méthode est ambigu, plusieurs méthodes candidates trouvées"
"教学提示" = "Plusieurs traits définissent une méthode du même nom. Utilisez la syntaxe pleinement qualifiée `trait::methode(valeur)` pour préciser l'appel."

[E0038]
"消息模板" = "ce trait contient des éléments incompatibles avec les objets trait"
"教学提示" = "Les objets trait exigent un trait sûr pour les objets : pas de méthodes génériques, et les méthodes avec paramètre `soi` doivent retourner un type objectivable. Ajustez le trait ou utilisez des génériques."

[E0040]
"消息模板" = "l'appel explicite d'un destructeur n'est pas autorisé"
"教学提示" = "Rust appelle automatiquement la logique de destruction. Supprimez l'appel manuel ; pour un contrôle explicite, enveloppez avec `Option` et retirez la valeur."

[E0044]
"消息模板" = "les éléments externes ne peuvent pas utiliser de paramètres de type ou de constante"
"教学提示" = "Les fonctions et statiques des blocs `externe` proviennent de bibliothèques externes et ne prennent pas en charge les génériques. Encapsulez-les dans une fonction générique."

[E0045]
"消息模板" = "les fonctions à arguments variables ne peuvent utiliser que la convention d'appel C"
"教学提示" = "Les arguments variables (`...`) ne sont pris en charge que dans les déclarations `externe \"C\"`. Utilisez la convention C ou une liste de paramètres fixe."

[E0046]
"消息模板" = "l'implémentation du trait omet des éléments requis"
"教学提示" = "L'implémentation d'un trait doit fournir tous les éléments sans implémentation par défaut. Complétez les méthodes manquantes."

[E0049]
"消息模板" = "le nombre de paramètres de type/constante de la méthode implémentée diffère de la définition"
"教学提示" = "Le nombre de paramètres génériques de la méthode implémentée doit être identique à celui du trait. Corrigez selon la déclaration."

[E0050]
"消息模板" = "le nombre de paramètres de la méthode implémentée diffère de la définition"
"教学提示" = "Le nombre de paramètres de la méthode implémentée doit correspondre à la définition du trait. Ajustez selon la déclaration."

[E0053]
"消息模板" = "les types des paramètres de la méthode implémentée ne correspondent pas à la définition"
"教学提示" = "Les types des paramètres doivent correspondre exactement à la définition du trait (mutabilité et mode de référence inclus). Corrigez selon la déclaration."

[E0054]
"消息模板" = "la conversion vers le type booléen n'est pas autorisée"
"教学提示" = "Rust ne prend pas en charge la conversion `valeur comme booleen`. Utilisez une expression de comparaison (par ex. `valeur != 0`) pour obtenir explicitement un booléen."

[E0055]
"消息模板" = "la profondeur de déréférencement automatique lors de l'appel de méthode dépasse la limite"
"教学提示" = "Les types forment une chaîne de déréférencement trop longue (souvent un cycle de déréférencement personnalisé). Déréférencez explicitement ou revoyez la conception des types."

[E0057]
"消息模板" = "le nombre de paramètres de la closure ne correspond pas : {期望} attendu(s), {实际} fourni(s)"
"教学提示" = "Le nombre de paramètres d'une closure doit correspondre à sa signature. Vérifiez la liste des paramètres et ajoutez ou retirez des paramètres."

[E0059]
"消息模板" = "la syntaxe des paramètres génériques du trait de fonction est incorrecte"
"教学提示" = "La syntaxe à chevrons exige un tuple en argument, par ex. `Fn<(i32,), Output=...>`. Utilisez généralement directement la syntaxe `Fn(i32) -> ...`."

[E0060]
"消息模板" = "les arguments fixes de la fonction variadique sont incomplets"
"教学提示" = "Lors de l'appel d'une fonction variadique, tous les arguments fixes doivent être fournis d'abord. Complétez les arguments manquants."

[E0061]
"消息模板" = "le nombre d'arguments de la fonction ne correspond pas"
"教学提示" = "Comparez avec la liste de paramètres de la définition de la fonction et ajoutez ou retirez les arguments."

[E0062]
"消息模板" = "le même champ apparaît plusieurs fois dans le littéral de structure"
"教学提示" = "Chaque champ ne peut être affecté qu'une fois. Supprimez le champ dupliqué ou fournissez la valeur via une variable."

[E0063]
"消息模板" = "des champs manquent dans l'initialisation de la structure"
"教学提示" = "Lors de l'initialisation d'une structure, tous les champs doivent être affectés. Les champs restants peuvent être remplis avec la syntaxe `..Default::default()`."

[E0067]
"消息模板" = "le côté gauche de l'opérateur d'affectation n'est pas une cible assignable"
"教学提示" = "Le côté gauche d'une affectation doit être une variable, un champ ou un index. Vérifiez l'expression de gauche."

[E0069]
"消息模板" = "la fonction a un type de retour autre que le tuple vide mais contient un retour sans valeur"
"教学提示" = "Une fonction dont le type de retour n'est pas `()` doit retourner une valeur. Écrivez `retourner valeur;` ou supprimez le retour."

