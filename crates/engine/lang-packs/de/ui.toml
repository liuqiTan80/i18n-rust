# Plain-language explanations of common methods / third-party library symbols
# (generated by AI from API names and signatures; for learning reference only)
["解释"]
"Option::unwrap" = "Takes the inner value directly; panics if it is None."
"Option::expect" = "Takes the inner value; panics with your custom message if it is None."
"Option::unwrap_or" = "Takes the value; uses the default you give when it is None."
"Option::unwrap_or_else" = "Takes the value; calls your function and uses its result when it is None."
"Option::is_some" = "Checks whether there is a value: returns true if Some."
"Option::is_none" = "Checks whether there is no value: returns true if None."
"Option::map" = "Transforms the value with a function if Some; None passes through."
"Option::and_then" = "Feeds the value into a function returning Option if Some; good for chaining."
"Option::ok_or" = "Turns Option into Result: Some becomes Ok, None becomes the error you specify."
"Option::flatten" = "Flattens Option<Option<T>> one level into Option<T>."
"Option::take" = "Takes the value out (leaving None in place); useful for moving a value under a borrow."
"Option::as_ref" = "Borrows Option<T> as Option<&T> without taking ownership."
"Option::get_or_insert" = "Inserts the default value if empty and returns a mutable reference to it."
"Result::unwrap" = "Takes the value inside Ok; panics with the error message if Err."
"Result::expect" = "Takes the value inside Ok; panics with your custom message if Err."
"Result::unwrap_or" = "Takes the value inside Ok; uses your default on Err."
"Result::unwrap_or_else" = "Takes the value inside Ok; calls your function and uses its result on Err."
"Result::is_ok" = "Checks for success: returns true if Ok."
"Result::is_err" = "Checks for failure: returns true if Err."
"Result::map" = "Transforms the value inside Ok with a function on success; errors pass through."
"Result::map_err" = "Transforms the error inside Err with a function on failure; success passes through."
"Result::and_then" = "Feeds the value into a function returning Result on success; short-circuits on failure."
"Result::ok" = "Turns Result into Option: Ok becomes Some, Err is dropped."
"Result::err" = "Turns Result into Option: Err becomes Some, Ok becomes None."
"Iterator::collect" = "Collects the iterator into a container (Vec, HashMap, ...); the target type is inferred from context."
"Iterator::map" = "Transforms each element in turn, returning a new iterator."
"Iterator::filter" = "Keeps only the elements satisfying the condition."
"Iterator::filter_map" = "Transforms while filtering: keeps elements whose function result is Some."
"Iterator::fold" = "Accumulates every element into an initial value from left to right, returning the final result."
"Iterator::sum" = "Adds all elements together (the element type must support addition)."
"Iterator::count" = "Counts how many elements remain."
"Iterator::enumerate" = "Pairs each element with its index, producing (index, element)."
"Iterator::zip" = "Pairs two iterators positionally into (a, b); stops when either is exhausted."
"Iterator::any" = "Returns true as soon as one element satisfies the condition (short-circuits)."
"Iterator::all" = "Returns true only if every element satisfies the condition (short-circuits)."
"Iterator::find" = "Returns the first element satisfying the condition, or None."
"Iterator::position" = "Returns the index of the first element satisfying the condition, or None."
"Iterator::take" = "Takes only the first n elements."
"Iterator::skip" = "Skips the first n elements."
"Iterator::cloned" = "Clones each referenced element into an owned value (common for iterators of &T)."
"Iterator::for_each" = "Runs a piece of code on each element (usually for side effects like printing)."
"Iterator::rev" = "Reverses the iteration order."
"Iterator::chain" = "Joins two iterators end to end into one."
"Vec::push" = "Appends one element at the end."
"Vec::pop" = "Removes and returns the last element as an Option."
"Vec::insert" = "Inserts an element at the given index, shifting later elements back."
"Vec::remove" = "Removes and returns the element at the given index, shifting later elements forward."
"Vec::len" = "Returns the number of elements."
"Vec::is_empty" = "Checks whether there are no elements."
"Vec::contains" = "Checks whether the vector contains a given element."
"Vec::sort" = "Sorts in ascending order in place."
"Vec::retain" = "Keeps only the elements satisfying the condition, in place."
"Vec::get" = "Indexes safely, returning None when out of bounds (safer than direct indexing)."
"Vec::iter" = "Returns a read-only iterator over the elements without taking ownership."
"Vec::iter_mut" = "Returns a mutable iterator so elements can be modified in place."
"Vec::clear" = "Removes all elements."
"Vec::extend" = "Appends all elements from another iterator."
"Vec::dedup" = "Removes consecutive duplicate elements in place."
"String::push_str" = "Appends a piece of text at the end of the string."
"String::push" = "Appends one character at the end of the string."
"String::len" = "Returns the length in bytes (note: one CJK character takes 3 bytes in UTF-8)."
"String::is_empty" = "Checks whether the string is empty."
"clone" = "Makes a copy of the data without moving the original (deep or shallow depends on the type)."
"into" = "Converts the value into another type (the target type must implement From)."
"as_ref" = "Borrows as a lightweight reference without consuming the value (the type must implement AsRef)."
"to_string" = "Converts the value to a string (std uses Display; in serialization libraries it outputs text)."
