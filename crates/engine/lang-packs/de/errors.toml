"教学提示" = "Die vorherigen Abgleich-Arme decken bereits alle möglichen Fälle ab, daher wird dieser Arm nie ausgeführt. Entfernen Sie den überflüssigen Arm oder ändern Sie die Reihenfolge."

[E0002]
"消息模板" = "leerer Abgleich auf einem nicht-leeren Typ ist nicht möglich"
"教学提示" = "Ein Abgleich-Ausdruck benötigt mindestens einen Arm. Fügen Sie Arme für alle möglichen Werte hinzu."

[E0004]
"消息模板" = "der Abgleich-Ausdruck ist nicht vollständig: es gibt mögliche Werte ohne passenden Arm"
"教学提示" = "Ein Abgleich muss alle möglichen Fälle abdecken. Ergänzen Sie die fehlenden Arme oder fügen Sie einen `_`-Platzhalter-Arm hinzu."

[E0005]
"消息模板" = "dieses Muster kann fehlschlagen, hier ist jedoch ein unfehlbares Muster erforderlich"
"教学提示" = "`lass`-Bindungen und Funktionsparameter erfordern unfehlbare Muster. Verwenden Sie für fehlschlagende Muster `abgleich` oder `wenn lass`."

