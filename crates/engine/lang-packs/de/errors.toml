"消息模板" = "(außer Dienst gestellter Fehlercode) ein Wert im Muster wird an mehrere Stellen bewegt"
"教学提示" = "Ein Wert kann nur in eine einzige Bindung bewegt werden. Ändern Sie die Bindung oder verwenden Sie Referenzen."

[E0009]
"消息模板" = "(außer Dienst gestellter Fehlercode) Werte ohne Copy im Muster müssen auf einheitliche Weise gebunden werden"
"教学提示" = "Alle Werte im selben Muster, die `Kopieren` (Copy) nicht implementieren, müssen einheitlich gebunden werden (alle bewegt oder alle geliehen)."

[E0010]
"消息模板" = "(außer Dienst gestellter Fehlercode) der Wert einer statischen Größe muss zur Kompilierzeit feststehen"
"教学提示" = "Die Werte von `statisch` und `konst` müssen zur Kompilierzeit bekannt sein. Initialisieren Sie mit konstanten Ausdrücken."

[E0013]
"消息模板" = "(außer Dienst gestellter Fehlercode) Konstanten dürfen nicht auf statische Größen verweisen"
"教学提示" = "`konst` kann auf andere Konstanten verweisen, aber nicht auf `statisch`-Größen. Lesen Sie statische Größen stattdessen in Funktionen."

[E0014]
"消息模板" = "(außer Dienst gestellter Fehlercode) Konstanten dürfen nur mit konstanten Werten initialisiert werden"
"教学提示" = "Die Initialisierung von Konstanten darf nur konstante Ausdrücke oder konstante Funktionsaufrufe verwenden. Vereinfachen Sie den Initialisierungsausdruck."

