"消息模板" = "eine nicht-konstante Funktion wurde in einem konstanten Kontext aufgerufen"
"教学提示" = "In `konst`- und `statisch`-Initialisierungen sowie Array-Längen dürfen nur konstante Funktionen (`konst funktion`) aufgerufen werden. Deklarieren Sie die Funktion als konstant oder berechnen Sie zur Laufzeit."

[E0023]
"消息模板" = "die Anzahl der aus der Aufzählungsvariante extrahierten Felder ist falsch"
"教学提示" = "Die Feldanzahl in einem Tupelvarianten-Muster muss mit der Definition übereinstimmen. Prüfen Sie die Definition der Variante."

[E0025]
"消息模板" = "dasselbe Feld einer Struktur wurde im Muster zweimal gebunden"
"教学提示" = "In einem Struktur-Muster darf jedes Feld nur einmal gebunden werden. Entfernen Sie die doppelte Bindung."

[E0026]
"消息模板" = "das Struktur-Muster verwendet ein nicht existierendes Feld"
"教学提示" = "Prüfen Sie die Schreibweise des Feldnamens und stellen Sie anhand der Strukturdefinition sicher, dass das Feld existiert."

[E0027]
"消息模板" = "das Struktur-Muster deckt nicht alle Felder ab"
"教学提示" = "Ein Struktur-Muster muss jedes Feld nennen oder mit `..` die übrigen Felder ignorieren."

[E0029]
"消息模板" = "nur Typen mit Ordnungsvergleich können mit Bereichen abgeglichen werden"
"教学提示" = "Die Bereichssyntax in Abgleichen unterstützt nur Typen wie Ganzzahlen und Zeichen, die `Teilvergleich` implementieren. Verwenden Sie für eigene Typen eine Wächterbedingung (`wenn` nach dem Arm)."

[E0030]
"消息模板" = "der Anfang des Abgleich-Bereichs ist größer als das Ende, der Bereich ist leer"
"教学提示" = "Ein Bereichsmuster enthält beide Endpunkte, der Anfang darf nicht größer als das Ende sein. Tauschen Sie die Endpunkte oder korrigieren Sie die Werte."

[E0033]
"消息模板" = "ein Merkmal-Objekt-Typ kann nicht direkt dereferenziert werden"
"教学提示" = "Merkmal-Objekte (`dynamisch Merkmal`) können nicht dereferenziert werden. Rufen Sie Methoden über Referenzen auf oder verwenden Sie einen konkreten Typ."

[E0034]
"消息模板" = "der Methodenaufruf ist mehrdeutig, es wurden mehrere Kandidaten gefunden"
"教学提示" = "Mehrere Merkmale definieren eine Methode mit demselben Namen. Verwenden Sie die vollqualifizierte Syntax `Merkmal::methode(wert)`, um den Aufruf eindeutig zu machen."

[E0038]
"消息模板" = "das Merkmal enthält Inhalte, die nicht als Merkmal-Objekt verwendet werden können"
"教学提示" = "Merkmal-Objekte erfordern objekt-sichere Merkmale: keine generischen Methoden, und Methoden mit `selbst`-Parameter müssen objektisierbare Typen zurückgeben. Passen Sie das Merkmal an oder verwenden Sie Generika."

[E0040]
"消息模板" = "der explizite Aufruf eines Destruktors ist nicht erlaubt"
