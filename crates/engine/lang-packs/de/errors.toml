[E0044]
"消息模板" = "externe Größen dürfen keine Typ- oder Konstantenparameter verwenden"
"教学提示" = "Funktionen und statische Größen in `extern`-Blöcken stammen aus fremden Bibliotheken und unterstützen keine Generika. Kapseln Sie sie in generischen Wrapper-Funktionen."

[E0045]
"消息模板" = "Funktionen mit variabler Argumentzahl dürfen nur die C-Aufrufkonvention verwenden"
