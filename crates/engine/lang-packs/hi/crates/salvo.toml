"मूल_क्रेट" = "salvo_core मूल crate का प्रकार उपनाम, संपूर्ण मूल API वहन करता है।"
"पकड़ने_वाला" = "अनुरोध प्रसंस्करण में उत्पन्न त्रुटियों को पकड़कर एकसमान रूप से प्रतिक्रिया में बदलता है।"
"पूर्व_निर्धारित_लक्ष्य" = "त्रुटि प्रबंधन का पूर्व निर्धारित लक्ष्य, त्रुटि प्रतिक्रिया की अंतिम गंतव्य तय करता है।"
"सॉकेट_पता_सैल्बो" = "नेटवर्क पता प्रकार, IP पता और पोर्ट दर्शाता है।"
"टीसीपी_श्रोता_सैल्बो" = "TCP पोर्ट सुनने वाला श्रोता, कनेक्शन धाराएँ उत्पन्न करता है।"
"टीसीपी_स्वीकर्ता" = "TCP कनेक्शन स्वीकार कर उन्हें अनुरोध धारा में बदलने वाली वस्तु।"
"गतिशील_टीसीपी_स्वीकर्ता" = "गतिशील प्रेषण वाला TCP कनेक्शन स्वीकर्ता लक्षण।"
"गतिशील_में_टीसीपी_स्वीकर्ता" = "ठोस स्वीकर्ता को गतिशील स्वीकर्ता में बदलने वाला आवरण।"
"गतिशील_टीसीपी_स्वीकर्ता_समूह" = "कई गतिशील स्वीकर्ताओं का समूह ढाँचा।"
