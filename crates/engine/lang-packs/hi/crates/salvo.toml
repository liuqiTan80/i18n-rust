# तीसरे पक्ष की लाइब्रेरी का स्वचालित रूप से जनरेट किया गया मानचित्रण
# crate: salvo
# इस फ़ाइल में व्याख्याएँ API नाम और हस्ताक्षर के आधार पर AI द्वारा स्वतः जनरेट की गई हैं, ये मूल crate के आधिकारिक दस्तावेज़ का अनुवाद नहीं हैं, केवल अध्ययन संदर्भ के लिए। मूल crate के सर्वाधिकार उनके लेखकों के हैं।
# मैन्युअल रूप से परिष्कृत: पहचानकर्ताओं को हिंदी में अनुवादित किया गया और व्याख्याएँ जोड़ी गईं।

