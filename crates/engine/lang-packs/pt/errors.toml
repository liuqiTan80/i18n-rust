# Arquivo de traducao de mensagens de erro (portugues)
# Formato: [codigo de erro] + "消息模板" (modelo da mensagem) + "教学提示" (dica didatica)
# Os marcadores {期望} {实际} {名称} {变量名} {类型} {特征} sao substituidos pelo compilador.

[E0308]
"消息模板" = "Tipos incompativeis: esperava-se `{期望}`, obteve-se `{实际}`"
"教学提示" = "Verifique se o tipo da variavel corresponde ao que o contexto exige. Tente converter o tipo com `como`."

[E0433]
"消息模板" = "Tipo `{名称}` nao encontrado"
"教学提示" = "Confirme que o modulo ou tipo necessario esta importado. Voce pode importa-lo com a palavra-chave `usar`."

[E0384]
"消息模板" = "Nao se pode atribuir duas vezes a variavel imutavel `{变量名}`"
"教学提示" = "Se voce precisa alterar o valor de uma variavel, declare-a com `deixar mutavel`."

[E0382]
"消息模板" = "Uso do valor apos sua movimentacao: `{变量名}`"
"教学提示" = "Em Rust, um valor movido nao pode mais ser usado. Utilize `referencia` (&) ou `clonar()` para evitar a movimentacao."

[E0502]
"消息模板" = "Nao se pode emprestar `{变量名}` como mutavel: ja esta emprestado como imutavel"
"教学提示" = "Rust nao permite emprestimos mutavel e imutavel ao mesmo tempo. Reduza o escopo do emprestimo imutavel."

[E0499]
"消息模板" = "Nao se pode emprestar `{变量名}` como mutavel varias vezes"
"教学提示" = "So pode existir uma referencia mutavel por vez. E o mecanismo do Rust para evitar corridas de dados."

[E0277]
"消息模板" = "O tipo `{类型}` nao implementa o trait `{特征}`"
"教学提示" = "Implemente o trait necessario para o tipo, ou use um tipo que ja o implemente."

[E0425]
"消息模板" = "O nome `{名称}` nao e encontrado neste escopo"
"教学提示" = "Verifique se o nome da variavel esta escrito corretamente e se foi declarado no escopo atual."

[E0282]
"消息模板" = "Nao se pode inferir o tipo, adicione uma anotacao de tipo"
"教学提示" = "O compilador nao consegue inferir o tipo automaticamente. Indique o tipo explicitamente, por exemplo: `deixar x: inteiro = 0;`"

[E0601]
"消息模板" = "A funcao `principal` nao e encontrada no pacote"
"教学提示" = "Todo programa executavel do Rust precisa de uma funcao `principal` como ponto de entrada. Adicione no codigo: funcao principal() { ... }"

# ============================================
# Ciclos de vida e emprestimos (serie E01xx/E04xx/E05xx)
# ============================================

[E0106]
"消息模板" = "Falta anotacao de ciclo de vida na funcao"
"教学提示" = "Quando uma funcao tem varios parametros de referencia, o compilador nao consegue inferir a relacao entre eles. Adicione anotacoes de ciclo de vida nos parametros e no retorno, por exemplo: funcao maisLonga<'a>(x: &'a texto, y: &'a texto) -> &'a texto"

[E0107]
"消息模板" = "Numero incorreto de parametros de ciclo de vida"
"教学提示" = "O numero de parametros de ciclo de vida na declaracao nao coincide com o uso. Verifique as anotacoes dentro de `<>`."

[E0116]
"消息模板" = "Nao se pode definir uma implementacao inerente para um tipo externo"
"教学提示" = "Blocos `implementacao` inerentes so podem ser definidos para tipos locais. Para tipos externos voce pode implementar traits, mas nao pode escrever um bloco `implementacao` direto."

[E0133]
"消息模板" = "A operacao insegura requer um bloco inseguro"
"教学提示" = "Operacoes como desreferenciar ponteiros crus devem ser feitas dentro de um bloco `inseguro`, pois o Rust nao pode garantir sua seguranca."

[E0204]
"消息模板" = "Nao se pode derivar Clone automaticamente"
"教学提示" = "Tipos com campos que nao implementam `clonavel` nao podem derivar clone. Implemente `clonavel` manualmente para o tipo do campo."

[E0210]
"消息模板" = "O parametro de tipo deve preceder todos os tipos locais (regra do orfao)"
"教学提示" = "Ao implementar um trait externo para um tipo externo, pelo menos o trait ou o tipo deve ser local; caso contrario, viola-se a regra do orfao."

[E0255]
"消息模板" = "O nome ja esta em uso como parametro generico"
"教学提示" = "O nome de uma variavel nao pode coincidir com o de um parametro generico. Renomeie a variavel ou o parametro."

[E0271]
"消息模板" = "Tipos incompativeis: a restricao do trait nao foi atendida"
"教学提示" = "O tipo real nao atende as restricoes do generico. Verifique se o tipo implementa o trait exigido."

[E0309]
"消息模板" = "O parametro generico nao atende a restricao do trait"
"教学提示" = "O parametro generico deve atender a restricao `{特征}` para usar os metodos correspondentes. Adicione a restricao na declaracao do generico."

[E0310]
"消息模板" = "O parametro generico nao atende a restricao Sized"
"教学提示" = "Por padrao, os parametros genericos devem ter tamanho conhecido (`tamanho_fixo`). Para tipos sem tamanho, adicione a restricao `?tamanho_fixo`."

# ============================================
# Tipos e traits (serie E03xx/E04xx)
# ============================================

[E0369]
"消息模板" = "Tipos incompativeis: nao se pode operar com `{期望}` e `{实际}`"
"教学提示" = "Os tipos nos dois lados do operador devem ser compativeis. Verifique se os operandos coincidem e, se necessario, converta com `como`."

[E0373]
"消息模板" = "O fechamento pode sobreviver ao valor temporario emprestado"
"教学提示" = "O fechamento captura uma referencia a um valor temporario e pode viver mais que ele. Use a palavra-chave `mover` ou prolongue o ciclo de vida do valor."

[E0404]
"消息模板" = "Esperava-se um trait, mas encontrou-se um tipo"
"教学提示" = "No lugar de `dinamico` ou de uma restricao generica e necessario o nome de um trait. Verifique se escreveu o nome corretamente."

[E0407]
"消息模板" = "O metodo nao e membro deste trait"
"教学提示" = "Ao implementar um trait, so se podem definir os metodos que ele declara. Verifique se o nome do metodo coincide com a definicao do trait."

[E0412]
"消息模板" = "Nao se consegue encontrar o tipo"
"教学提示" = "O tipo usado nao existe ou nao esta importado. Importe-o com `usar` ou revise a ortografia."

[E0422]
"消息模板" = "Nao se consegue encontrar a estrutura, enumeracao ou uniao"
"教学提示" = "O nome para construir a estrutura nao existe. Verifique a ortografia ou se ela esta definida no escopo atual."

[E0432]
"消息模板" = "Nao se consegue resolver o caminho de importacao"
"教学提示" = "O modulo ou elemento importado nao existe. Revise o caminho e confirme que o modulo esta declarado (`modulo xxx;`) e e visivel."

[E0435]
"消息模板" = "Um valor nao constante foi usado dentro de uma constante"
"教学提示" = "O valor de `constante` deve ser conhecido em tempo de compilacao. Valores de execucao (chamadas de funcoes) nao servem para inicializar constantes; use `estatico` ou `deixar`."

[E0436]
"消息模板" = "Definicao duplicada de funcao"
"教学提示" = "Nao se podem definir duas funcoes com o mesmo nome no mesmo escopo. Revise as definicoes duplicadas de `funcao xxx()`."

[E0463]
"消息模板" = "Pacote nao encontrado"
"教学提示" = "O pacote externo nao esta instalado ou nao esta declarado em [dependencies] do Cargo.toml. Adicione primeiro a dependencia."

# ============================================
# Propriedade e movimentacao (serie E05xx)
# ============================================

[E0496]
"消息模板" = "O ciclo de vida nao pode escapar do seu escopo"
"教学提示" = "O ciclo de vida de uma referencia nao pode ultrapassar o do valor ao qual aponta. Revise a estrutura de propriedade dos dados."

[E0505]
"消息模板" = "O valor foi movido enquanto estava emprestado"
"教学提示" = "Enquanto existirem referencias a um valor, ele nao pode ser movido. Termine primeiro o emprestimo ou use `clonar()` para copiar os dados."

[E0507]
"消息模板" = "Nao se pode mover o conteudo de uma referencia"
"教学提示" = "Nao se pode mover o valor ao qual uma referencia aponta. Use `clonar()` ou acesse os campos por referencia em vez de mover tudo."

[E0508]
"消息模板" = "Nao se pode mover o conteudo de um array"
"教学提示" = "Os elementos de um array nao podem ser movidos para fora. Use indice + `clonar()` ou converta o array em um vetor (`vetor`)."

[E0515]
"消息模板" = "Nao se pode devolver uma referencia a uma variavel local"
"教学提示" = "A variavel local e destruida ao terminar a funcao, portanto nao se pode devolver sua referencia. Devolva o valor (a propriedade) ou use `caixa`."

[E0530]
"消息模板" = "A ligacao do corresponder oculta a variante da enumeracao"
"教学提示" = "O nome da ligacao no padrao nao pode coincidir com o de uma variante de enumeracao. Renomeie a variavel de ligacao."

[E0539]
"消息模板" = "Numero incorreto de argumentos de macro"
"教学提示" = "A quantidade de argumentos ao chamar a macro nao coincide com sua definicao. Revise o uso da macro."

[E0559]
"消息模板" = "O campo nao existe"
"教学提示" = "A estrutura nao possui esse campo. Verifique a ortografia do nome ou o tipo de estrutura usado."

[E0560]
"消息模板" = "A estrutura nao possui esse campo"
"教学提示" = "Ao inicializar a estrutura, indicou-se um campo inexistente. Revise a definicao da estrutura e os campos usados."

[E0574]
"消息模板" = "Esperava-se o nome de uma estrutura ou enumeracao"
"教学提示" = "Aqui e necessario um nome de tipo, nao um valor ou expressao. Revise a sintaxe."

[E0594]
"消息模板" = "Nao se pode atribuir a uma variavel imutavel"
"教学提示" = "Variaveis declaradas com `deixar` sao imutaveis por padrao. Para modifica-las, use `deixar mutavel`."

[E0596]
"消息模板" = "Nao se pode emprestar como mutavel"
"教学提示" = "Somente variaveis mutaveis podem ser emprestadas como mutaveis (`referencia_mutavel`). Declare a variavel com `deixar mutavel` ou marque o parametro como `mutavel`."

[E0597]
"消息模板" = "O valor emprestado nao vive o suficiente"
"教学提示" = "O ciclo de vida da referencia ultrapassa o do valor referenciado. Ajuste os escopos para que o valor viva mais."

[E0599]
"消息模板" = "O tipo nao possui um metodo com esse nome"
"教学提示" = "O metodo chamado nao existe neste tipo. Revise a ortografia ou importe o trait que fornece o metodo."

[E0603]
"消息模板" = "O modulo e privado"
"教学提示" = "Por padrao, os modulos sao privados. Para acessar de fora, declare-o com `publico modulo xxx;`."

[E0610]
"消息模板" = "O tipo nao possui campos"
"教学提示" = "O tipo ao qual voce tenta acessar nao contem campos. Verifique se nao esta desreferenciando o tipo errado."

[E0614]
"消息模板" = "Nao se pode desreferenciar este tipo"
"教学提示" = "Somente referencias (`referencia` — &) ou tipos que implementam o trait `desreferenciavel` (Deref) podem ser desreferenciados com `desreferencia` (*)."

[E0618]
"消息模板" = "Esperava-se uma funcao, mas isso nao e uma funcao"
"教学提示" = "A sintaxe de chamada `xxx()` exige que xxx seja uma funcao ou um fechamento. Verifique se nao esta chamando uma variavel como funcao."

[E0621]
"消息模板" = "Ciclo de vida incompativel, exige-se anotacao explicita"
"教学提示" = "A relacao entre a referencia de retorno e as referencias dos parametros exige anotacao explicita. Adicione um parametro de ciclo de vida a funcao."

[E0624]
"消息模板" = "O campo ou metodo e privado"
"教学提示" = "Os campos de uma estrutura sao privados por padrao. Adicione `publico` ao campo ou forneca um metodo de acesso publico."

# ============================================
# Outros (serie E06xx/E07xx)
# ============================================

[E0658]
"消息模板" = "Uso de um recurso instavel"
"教学提示" = "Este recurso ainda nao e estavel na versao atual do Rust. Verifique se `#![feature(...)]` esta ativado ou use uma alternativa estavel."

[E0716]
"消息模板" = "O valor temporario foi destruido antes de terminar a sentenca"
"教学提示" = "Uma referencia a um valor criado temporariamente nao pode ser usada fora da sentenca. Vincule primeiro o valor a uma variavel e depois tome a referencia."

[E0759]
"消息模板" = "O parametro de ciclo de vida esta restringido por um limite incompativel"
"教学提示" = "Os limites de ciclo de vida do tipo nao coincidem com a declaracao da funcao. Unifique as anotacoes de ciclo de vida."

# ==================== Cobertura completa do indice oficial de erros (modelos de texto puro) ====================
[E0001]
"消息模板" = "Este braco de correspondencia nunca pode ser alcancado"
"教学提示" = "Os bracos anteriores ja cobrem todos os casos possiveis, este braco nunca sera executado. Remova o braco sobrante ou ajuste a ordem da correspondencia."
[E0002]
"消息模板" = "Nao se pode fazer uma correspondencia vazia em um tipo nao vazio"
"教学提示" = "A expressao de correspondencia precisa de pelo menos um braco. Adicione bracos para todos os valores possiveis."
[E0004]
"消息模板" = "A correspondencia nao e exaustiva: existem valores possiveis sem braco"
"教学提示" = "A correspondencia deve cobrir todos os casos possiveis. Complete os bracos faltantes ou adicione um braco coringa `_`."
[E0005]
"消息模板" = "O padrao nao garante correspondencia, mas aqui exige-se um padrao irrefutavel"
"教学提示" = "Posicoes como vinculacao `deixar` e parametros de funcao exigem padroes que sempre correspondem. Para padroes que podem falhar, use `corresponder` ou `se deixar`."
[E0007]
"消息模板" = "(codigo de erro retirado) o valor do braco de correspondencia foi movido para varias posicoes"
"教学提示" = "Um valor so pode ser movido para uma vinculacao. Ajuste a forma de vinculacao ou use referencias."
[E0009]
"消息模板" = "(codigo de erro retirado) valores de tipos sem Copy no padrao devem ser vinculados da mesma forma"
"教学提示" = "No mesmo padrao, todos os valores que nao implementam `克隆复制` (Copy) devem ter vinculacao consistente (todos movidos ou todos emprestados)."
[E0010]
"消息模板" = "(codigo de erro retirado) o valor do item estatico deve ser determinado em tempo de compilacao"
"教学提示" = "Os valores de `estatico` e `constante` devem ser conhecidos em tempo de compilacao. Inicialize com uma expressao constante."
[E0013]
"消息模板" = "(codigo de erro retirado) uma constante nao pode referenciar um item estatico"
"教学提示" = "Uma `constante` pode referenciar outras constantes, mas nao um item `estatico`. Leia o item estatico dentro de uma funcao."
[E0014]
"消息模板" = "(codigo de erro retirado) constantes so podem ser inicializadas com valores constantes"
"教学提示" = "A inicializacao de constantes so pode usar expressoes constantes ou chamadas de funcoes constantes. Simplifique a expressao de inicializacao."
[E0015]
"消息模板" = "Uma funcao nao constante foi chamada em contexto constante"
"教学提示" = "Posicoes como `constante`, inicializacao de `estatico` e tamanho de array so podem chamar funcoes constantes (`constante funcao`). Declare a funcao como constante ou calcule em tempo de execucao."
[E0023]
"消息模板" = "O numero de campos extraidos do variante da enumeracao esta incorreto"
"教学提示" = "O numero de campos no padrao de variante de tupla deve coincidir com a definicao. Verifique a definicao do variante."
[E0025]
"消息模板" = "O mesmo campo da estrutura foi vinculado duas vezes no padrao"
"教学提示" = "No padrao de estrutura cada campo so pode ser vinculado uma vez. Remova a vinculacao duplicada."
[E0026]
"消息模板" = "O padrao de estrutura usa um campo inexistente"
"教学提示" = "Verifique a ortografia do nome do campo e confirme na definicao da estrutura que o campo existe."
[E0027]
"消息模板" = "O padrao de estrutura nao cobre todos os campos"
"教学提示" = "O padrao de estrutura deve mencionar cada campo, ou adicionar `..` ao final para ignorar os restantes."
[E0029]
"消息模板" = "Somente tipos com comparacao de ordenacao podem corresponder a intervalos"
"教学提示" = "A sintaxe de intervalo na correspondencia so admite inteiros, caracteres e outros tipos que implementam `部分排序`. Para tipos proprios use uma condicao de guarda (`se` apos o braco)."
[E0030]
"消息模板" = "O inicio do intervalo de correspondencia e maior que o fim; o intervalo e vazio"
"教学提示" = "O padrao de intervalo inclui os dois extremos; o inicio nao pode ser maior que o fim. Troque os extremos ou corrija os valores."
[E0033]
"消息模板" = "Nao se pode desreferenciar diretamente um tipo de objeto de trait"
"教学提示" = "O objeto de trait (`dinamico trait`) nao pode ser desreferenciado. Chame o metodo pela referencia ou use um tipo concreto."
[E0034]
"消息模板" = "A chamada de metodo e ambigua: varios metodos candidatos foram encontrados"
"教学提示" = "Varios traits definem um metodo com o mesmo nome. Use a sintaxe totalmente qualificada `Trait::metodo(valor)` para indicar qual chamar."
[E0038]
"消息模板" = "O trait contem elementos que impedem o uso como objeto de trait"
"教学提示" = "O objeto de trait exige que o trait seja seguro para objetos: sem metodos genericos, e metodos com parametro `mesmo` devem retornar tipos objetificaveis. Ajuste a definicao do trait ou use genericos."
[E0040]
"消息模板" = "Nao e permitido chamar explicitamente o destrutor"
"教学提示" = "O Rust chama a logica de destruicao automaticamente pelo compilador. Remova a chamada manual; se precisar controlar o momento da destruicao, envolva com `opcao` e retire o valor."
[E0044]
"消息模板" = "Itens externos nao podem usar parametros de tipo ou de constante"
"教学提示" = "As funcoes e itens estaticos em blocos `externo` vem de bibliotecas externas e nao admitem genericos. Encapsule com uma funcao generica no lado Rust."
[E0045]
"消息模板" = "Funcoes variadicas so podem usar a convencao de chamada C"
"教学提示" = "Os parametros variadicos (`...`) so sao admitidos em declaracoes `externo \"C\"`. Use a convencao de chamada C ou uma lista fixa de parametros."
[E0046]
"消息模板" = "A implementacao do trait nao tem os itens obrigatorios"
"教学提示" = "Ao implementar um trait e preciso fornecer todos os itens sem implementacao padrao. Complete os metodos ou itens associados faltantes."
[E0049]
"消息模板" = "O numero de parametros de tipo/constante da implementacao do metodo do trait nao coincide com a definicao"
"教学提示" = "O numero de parametros genericos do metodo implementado deve coincidir exatamente com a definicao do trait. Corrija conforme a declaracao do trait."
[E0050]
"消息模板" = "O numero de parametros da implementacao do metodo do trait nao coincide com a definicao"
"教学提示" = "O numero de parametros do metodo implementado deve coincidir com a definicao do trait. Complete ou remova parametros conforme a declaracao do trait."
[E0053]
"消息模板" = "O tipo dos parametros da implementacao do metodo do trait nao coincide com a definicao"
"教学提示" = "Os tipos dos parametros do metodo implementado devem coincidir exatamente com a definicao do trait (incluindo mutabilidade e forma de referencia). Corrija conforme a declaracao do trait."
[E0054]
"消息模板" = "Nao e permitido converter para o tipo booleano"
"教学提示" = "O Rust nao admite a conversao `valor como booleano`. Use uma expressao de comparacao (como `valor != 0`) para obter o booleano explicitamente."
[E0055]
"消息模板" = "A recursao da desreferencia automatica na chamada de metodo excedeu o limite"
"教学提示" = "Os tipos formaram uma cadeia de desreferencia longa demais (comum em ciclos de desreferencia propria). Desreferencie explicitamente ou refatore o desenho dos tipos."
[E0057]
"消息模板" = "Numero de parametros da clausura incompativel: esperava-se {期望}, obteve-se {实际}"
"教学提示" = "O numero de parametros da clausura deve coincidir com a sua assinatura de tipo. Verifique a lista de parametros e complete ou remova os sobrantes."
[E0059]
"消息模板" = "A escrita dos parametros genericos do trait de funcao esta incorreta"
"教学提示" = "A sintaxe com colchetes angulares exige que o parametro seja uma tupla, por exemplo `Fn<(i32,), Output=...>`. Normalmente use diretamente a sintaxe `Fn(i32) -> ...`."
[E0060]
"消息模板" = "A funcao variadica nao recebeu parametros fixos suficientes"
"教学提示" = "Ao chamar uma funcao variadica, todos os parametros fixos devem ser passados primeiro. Complete os argumentos faltantes."
[E0061]
"消息模板" = "Numero de parametros da funcao incompativel: esperava-se mais ou menos do que o passado"
"教学提示" = "Compare com a lista de parametros na definicao da funcao e complete os argumentos faltantes ou remova os excedentes."
[E0062]
"消息模板" = "O mesmo campo apareceu varias vezes no literal de estrutura"
"教学提示" = "Cada campo so pode ser atribuido uma vez. Remova o campo duplicado ou forneca o valor por uma variavel."
[E0063]
"消息模板" = "A estrutura esta com campos faltantes"
"教学提示" = "Ao inicializar uma estrutura, todos os campos devem receber valor. Os campos restantes podem ser preenchidos de uma vez com a sintaxe `..padrao::padrao()`."
[E0067]
"消息模板" = "O lado esquerdo do operador de atribuicao nao e um destino atribuivel"
"教学提示" = "O lado esquerdo da atribuicao deve ser uma variavel, campo, indice ou outra posicao que possa armazenar valor. Verifique a expressao do lado esquerdo."
[E0069]
"消息模板" = "A funcao nao retorna tupla vazia, mas ha um retorno sem valor"
"教学提示" = "Funcoes com tipo de retorno diferente de `()` devem retornar um valor. Use `retornar valor;` ou remova a instrucao de retorno."
