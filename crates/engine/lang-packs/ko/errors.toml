"消息模板" = "크레이트에서 `메인` 함수를 찾을 수 없습니다"
"教学提示" = "실행 가능한 Rust 프로그램에는 진입점으로 `메인` 함수가 필요합니다. `함수 메인() { ... }`를 추가하세요."

