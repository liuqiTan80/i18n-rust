# MySQL / MariaDB 客户端映射（mysql crate，同步连接）
# 说明：适用于以 mysql crate 同步连接访问 MySQL / MariaDB 的项目。
#  - 同步连接适合数据量小、调用低频的场景（如桌面应用本地库）；
#  - 位置参数用切片写法 `&[&dyn ToValue]`（mysql_common::params! 宏仅支持命名参数）。

["模块路径"]
"MySQL" = "mysql"

["标识符"]
"预导入" = "prelude"  # mysql::prelude（Queryable 等查询特征所在）
"数据库连接" = "Conn"  # mysql::Conn 同步连接对象
"连接选项" = "Opts"  # mysql::Opts 连接参数（由连接串解析生成）
"从网址" = "from_url"  # Opts::from_url 从连接串解析（返回 Result）
"执行语句" = "exec_drop"  # Queryable::exec_drop 带参执行（丢弃结果）
"值转换" = "ToValue"  # mysql_common ToValue（&[&dyn ToValue] 位置参数切片）
"查询语句" = "query_drop"  # Queryable::query_drop 无参查询 / DDL（丢弃结果）
"取首行" = "query_first"  # Queryable::query_first 取单行（Option<Row>）
"开启事务" = "start_transaction"  # Conn::start_transaction 开启事务

["解释"]
"数据库连接" = "到 MySQL / MariaDB 的同步连接对象（mysql crate）"
"预导入" = "mysql::prelude 模块，导入 Queryable 等特征后可使用查询方法"
"从网址" = "从 mysql:// 连接串解析出连接选项（Opts::from_url）"
"查询语句" = "无参查询或 DDL 语句（丢弃结果，如建表、DELETE 全表）"
"取首行" = "取查询结果的第一行（返回 Option<Row>）"
