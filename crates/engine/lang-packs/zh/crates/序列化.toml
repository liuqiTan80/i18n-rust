# crate 名称映射（用于 use 路径）
["模块路径"]
"序列化" = "serde"
"JSON序列化" = "serde_json"
"TOML处理" = "toml"
"二进制编码" = "bincode"

# 内部标识符映射（用于库内的类型、函数等）
["标识符"]
# serde
"可序列化" = "Serialize"
"可反序列化" = "Deserialize"
"序列化器" = "Serializer"
"反序列化器" = "Deserializer"
"序列化" = "serialize"
"反序列化" = "deserialize"
# serde 属性专用词：`#[serde(rename = ...)]` 里的 crate 名。`序列化` 同时映射
# serialize 方法，属性位会误取 serialize，故单列此词只映射 serde（派生辅助属性位）。
"序列化属性" = "serde"
"跳过序列化若" = "skip_serializing_if"  # serde 属性位：可选字段为空时跳过序列化

# serde_json
"JSON序列化" = "serde_json"  # 模块路径词在函数体内的副本（serde_json:: 前缀调用）
"JSON值" = "Value"
"JSON对象" = "Object"
"JSON数组" = "Array"
"解析字符串" = "from_str"
"解析值" = "from_value"  # serde_json::from_value（诊断簇 cargo 包装行解析）
"转字符串" = "to_string"
"美化输出" = "to_string_pretty"  # serde_json::to_string_pretty
"序列化为值" = "to_value"  # serde_json::to_value（诊断簇测试把结构转 JSON 值断言）
"从文件读取" = "from_reader"
"写入文件" = "to_writer"

# serde_json::Value 取值与类型判断（office-zb 使用反馈）
"作为字符串" = "as_str"
"作为长整数" = "as_u64"
"作为对象" = "as_object"
"作为数组" = "as_array"
"是对象" = "is_object"
"是数组" = "is_array"
"是字符串" = "is_string"

# toml
"TOML处理" = "toml"
"TOML值" = "Value"  # toml::Value（与 serde_json 的 `JSON值` 同英文不同域）
"反序列化模块" = "de"
"表格" = "Table"
"字符串值" = "String"
"数组值" = "Array"  # toml::Value::Array（与 `字符串值`/`表格` 同为 Value 变体，纯中文形）

# bincode
"编码" = "encode"
"解码" = "decode"
