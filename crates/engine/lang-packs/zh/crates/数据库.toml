# crate 名称映射（用于 use 路径）
["模块路径"]
"数据库" = "sqlx"
"ORM" = "diesel"
"SQLite" = "rusqlite"

# 内部标识符映射（用于库内的类型、函数等）
["标识符"]
# sqlx
"池" = "Pool"
"连接对象" = "Connection"
"查询" = "query"
"执行" = "execute"
"抓取" = "fetch"
"获取全部" = "fetch_all"
"获取一个" = "fetch_one"
"获取可选" = "fetch_optional"
"事务" = "Transaction"
"迁移" = "migrate"

# diesel
"查询构建器" = "QueryDsl"
"可插入" = "Insertable"
"可查询" = "Queryable"
"表" = "Table"
"选择" = "select"
"过滤" = "filter"
"排序依据" = "order"
"限制" = "limit"

# rusqlite
"SQLite" = "rusqlite"  # 函数体内限定路径可用（模块路径节仅在 use 语句生效）
# 注：Connection 类型复用上方 sqlx 节的「连接对象」词条（同值），use rusqlite::Connection 写 ôSQLite::连接对象ô
"语句" = "Statement"
"准备" = "prepare"
"绑定参数" = "params"  # rusqlite::params! 宏（「参数」已被 env::args 占用）
"数据行" = "Row"  # rusqlite::Row 行数据（「行」已被 line 占用）
"取列" = "get_opt"  # Row::get_opt 缺失列返回 None：默认路径不 panic，编译期强制处理「无」
"取列或空" = "get_opt"  # 同义词（旧写法保留）：语义更直白，同样返回 Option
"取列或崩溃" = "get"  # Row::get 列越界/类型不符会 panic：要 panic 必须显式写
"查询映射" = "query_map"  # Statement::query_map 行迭代
"单行查询" = "query_row"  # Connection::query_row 取单行
"执行批处理" = "execute_batch"  # Connection::execute_batch 建表等多语句
"开始事务" = "transaction"  # Connection::transaction（「事务」=Transaction 为类型名）
"提交" = "commit"  # Transaction::commit
"数据库错误" = "Error"  # rusqlite::Error 错误类型
"取值类型" = "types"  # rusqlite::types 模块
"取值引用" = "ValueRef"  # rusqlite::types::ValueRef 列值引用
"打开带标志" = "open_with_flags"  # Connection::open_with_flags 指定打开模式（只读等）
"打开标志" = "OpenFlags"  # rusqlite::OpenFlags 打开标志位
"只读打开" = "SQLITE_OPEN_READ_ONLY"  # OpenFlags::SQLITE_OPEN_READ_ONLY 只读模式
"空值字段" = "Null"
"文本值" = "Text"  # 「文本」已被 str 占用
"字节块" = "Blob"
"取列引用" = "get_ref"  # Row::get_ref 按列号取 ValueRef（文本/字节块等原样引用；越界/类型不符会 panic）
"整数值" = "Integer"
"浮点值" = "Real"

# ============================================================
# 危险等级（词条表逐条标注的数据源；不参与转译）
# 取值：panic / rewrite / safe，多风险用 + 连接
# ============================================================
["危险等级"]
"取列" = "safe"  # get_opt：缺失列返回「无」，不 panic
"取列或空" = "safe"
"取列或崩溃" = "panic"
"取列引用" = "panic"

["危险备注"]
"取列" = "安全默认：get_opt 缺失列返回「无」（None），编译期强制处理；确需 panic 请显式写「取列或崩溃」"
"取列或崩溃" = "Row::get 列号越界/类型不符会 panic；仅在显式选择时使用（要 panic 必须显式写）"
"取列或空" = "安全默认：缺失列返回「无」（None），不 panic"
"取列引用" = "Row::get_ref 列号越界/类型不符会 panic；仅在显式需要列值引用时使用"
