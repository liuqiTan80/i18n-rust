# crate 名称映射（用于 use 路径）
["模块路径"]
"数据库" = "sqlx"
"ORM" = "diesel"
"SQLite" = "rusqlite"

# 内部标识符映射（用于库内的类型、函数等）
["标识符"]
# sqlx
"池" = "Pool"
"连接" = "Connection"
"查询" = "query"
"执行" = "execute"
"获取" = "fetch"
"获取全部" = "fetch_all"
"获取一个" = "fetch_one"
"获取可选" = "fetch_optional"
"事务" = "Transaction"
"迁移" = "migrate"

# diesel
"查询构建器" = "QueryDsl"
"可插入" = "Insertable"
"可查询" = "Queryable"
"表" = "Table"
"选择" = "select"
"过滤" = "filter"
"排序依据" = "order"
"限制" = "limit"

# rusqlite
"语句" = "Statement"
"准备" = "prepare"
