# ============================================
# 大白话解释表（LSP hover 提示）
# 键 = 符号路径：std 用 "类型::方法" 短路径，
# 第三方用方法名/宏名（对应 hover 提取的候选键）
# ============================================
["解释"]
"Option::unwrap" = "直接取出里面的值；如果没有值（None），程序直接崩溃"
"Option::expect" = "取出里面的值；如果没有值，就带着你写的提示信息崩溃"
"Option::unwrap_or" = "取出值；没有值就用你给的默认值代替"
"Option::unwrap_or_else" = "取出值；没有值就调用你给的函数，用它的返回值代替"
"Option::is_some" = "判断是否“有值”：有值返回 true"
"Option::is_none" = "判断是否“没有值”：没有值返回 true"
"Option::map" = "如果有值，用函数把它变换成新值；没有值就原样传播"
"Option::and_then" = "如果有值，把值喂给“返回 Option 的函数”，适合链式组合"
"Option::ok_or" = "把 Option 转成 Result：有值变 Ok，没有值变成你指定的错误"
"Option::flatten" = "把 Option<Option<T>> 摊平一层，变成 Option<T>"
"Option::take" = "把值取走（原地换成 None），常用于借用环境下搬走值"
"Option::as_ref" = "把 Option<T> 借成 Option<&T>，处理时不拿走所有权"
"Option::get_or_insert" = "没有值就把默认值放进去，并返回它的可变引用"
"Result::unwrap" = "取出 Ok 里的值；如果是 Err，带着错误信息直接崩溃"
"Result::expect" = "取出 Ok 里的值；如果是 Err，带着你写的提示崩溃"
"Result::unwrap_or" = "取出 Ok 里的值；Err 时用你给的默认值代替"
"Result::unwrap_or_else" = "取出 Ok 里的值；Err 时调用你给的函数，用它的返回值代替"
"Result::is_ok" = "判断是否成功：是 Ok 就返回 true"
"Result::is_err" = "判断是否失败：是 Err 就返回 true"
"Result::map" = "成功时用函数变换 Ok 里的值；失败原样传播"
"Result::map_err" = "失败时用函数变换 Err 里的错误；成功原样传播"
"Result::and_then" = "成功后把值喂给“返回 Result 的函数”，失败直接短路"
"Result::ok" = "把 Result 转成 Option：Ok 变 Some，Err 被丢弃"
"Result::err" = "把 Result 转成 Option：Err 变 Some，Ok 变 None"
"Iterator::collect" = "把迭代器收集成容器（Vec、HashMap 等），目标类型由上下文推断"
"Iterator::map" = "对每个元素依次做变换，返回新的迭代器"
"Iterator::filter" = "只保留满足条件的元素"
"Iterator::filter_map" = "一边变换一边过滤：函数返回 Some 的元素才保留"
"Iterator::fold" = "从左到右把每个元素累加进一个初始值，返回最终结果"
"Iterator::sum" = "把所有元素加起来（要求元素类型能相加）"
"Iterator::count" = "数一数还剩多少个元素"
"Iterator::enumerate" = "让每个元素带上它的下标，变成 (下标, 元素)"
"Iterator::zip" = "把两个迭代器按位置配对成 (a, b) 对，任一个耗尽就结束"
"Iterator::any" = "只要有一个元素满足条件就返回 true（提前短路）"
"Iterator::all" = "所有元素都满足条件才返回 true（提前短路）"
"Iterator::find" = "返回第一个满足条件的元素，找不到返回 None"
"Iterator::position" = "返回第一个满足条件的元素下标，找不到返回 None"
"Iterator::take" = "只取前 n 个元素"
"Iterator::skip" = "跳过前 n 个元素"
"Iterator::cloned" = "把每个元素的引用克隆成值（对 &T 的迭代器很常用）"
"Iterator::for_each" = "对每个元素执行一段代码（一般用于打印等副作用）"
"Iterator::rev" = "反转迭代顺序"
"Iterator::chain" = "把两个迭代器首尾相接，变成一个"
"Vec::push" = "在末尾追加一个元素"
"Vec::pop" = "取出并移除末尾元素，返回 Option"
"Vec::insert" = "在指定下标插入元素，后面的元素往后挪"
"Vec::remove" = "移除并返回指定下标的元素，后面的元素往前补"
"Vec::len" = "返回元素个数"
"Vec::is_empty" = "判断是否没有元素"
"Vec::contains" = "判断是否包含某个元素"
"Vec::sort" = "原地升序排序"
"Vec::retain" = "原地只保留满足条件的元素"
"Vec::get" = "按下标取值，越界返回 None（比直接下标安全）"
"Vec::iter" = "获得元素的只读迭代器，不拿走所有权"
"Vec::iter_mut" = "获得元素的可变迭代器，可以原地改元素"
"Vec::clear" = "清空所有元素"
"Vec::extend" = "把另一个迭代器的元素全部追加进来"
"Vec::dedup" = "去掉相邻重复的元素（原地）"
"String::push_str" = "在字符串末尾追加一段文本"
"String::push" = "在字符串末尾追加一个字符"
"String::len" = "返回字符串的字节数（中文一个字占 3 字节，注意）"
"String::is_empty" = "判断是否为空字符串"
"clone" = "复制一份数据，不拿走原值（深浅由类型决定）"
"into" = "把值转换成另一种类型（目标类型需实现 From）"
"as_ref" = "借用为轻量引用形式，不消耗原值（类型需实现 AsRef）"
"to_string" = "把值转换成字符串（std 用 Display 显示；序列化库中是输出文本）"
"parse" = "把字符串解析成目标类型（如数字），失败返回 Err"
"trim" = "去掉字符串两端的空白字符"
"split" = "按分隔符拆成子串迭代器"
"chars" = "按 Unicode 字符逐个迭代（而不是按字节）"
"replace" = "把所有匹配的子串替换成新文本，返回新字符串"
"starts_with" = "判断字符串是否以指定前缀开头"
"ends_with" = "判断字符串是否以指定后缀结尾"
"to_lowercase" = "把字符串转成小写，返回新字符串"
"to_uppercase" = "把字符串转成大写，返回新字符串"
"contains" = "判断是否包含某个元素或子串"
"spawn" = "开一个异步任务放后台运行，立刻返回句柄（tokio 等运行时）"
"sleep" = "异步等待指定时长，要放在 .await 后（tokio）"
"select" = "同时等待多个异步分支，先完成的分支执行（tokio 宏）"
"join" = "同时等待多个 future 全部完成再继续（tokio/futures 宏）"
"try_join" = "同时等待多个 future，有一个失败就整体返回错误（宏）"
"channel" = "创建多生产者多消费者异步通道（tokio）"
"oneshot" = "创建一次性异步通道：只能发一次、收一次（tokio）"
"broadcast" = "创建广播通道：一条消息发给所有接收者（tokio）"
"interval" = "按固定间隔持续产生信号的计时器（tokio）"
"spawn_blocking" = "把耗时的同步任务放到专用线程跑，不阻塞异步运行时（tokio）"
"main" = "程序入口函数；标注 #[tokio::main] 时是异步运行时入口"
"Serialize" = "派生宏：让结构体可以被序列化（转 JSON 等格式）"
"Deserialize" = "派生宏：让结构体可以从数据反序列化回来"
"from_str" = "从文本解析成值（serde_json/toml 等库的入口）"
"from_reader" = "从文件或流读取并反序列化"
"to_writer" = "把值序列化写入文件或流"
"Value" = "serde_json 的通用动态值类型，可表示任意 JSON 数据"
"encode" = "把值编码成紧凑的二进制格式（bincode）"
"decode" = "从二进制数据解码出值（bincode）"
"Router" = "axum 的路由表：把路径和处理函数绑定起来"
"App" = "actix-web 的应用入口：注册路由和中间件"
"HttpServer" = "actix-web 的 HTTP 服务器：绑定地址并监听端口"
"route" = "注册“路径 → 处理函数”的路由"
"handler" = "定义一个请求处理函数（axum）"
"Path" = "从 URL 路径中提取参数，如 /users/{id}（axum）"
"Query" = "从 URL 查询串提取参数（axum）"
"State" = "在多个请求处理器之间共享状态（axum）"
"Json" = "把结构体包装成 JSON 请求体或响应体（axum）"
"launch" = "启动 Rocket 应用并开始监听"
"serve" = "启动 HTTP 服务器监听端口（axum）"
"Filter" = "warp 的过滤器特征：用组合方式构建路由"
"reply" = "构造并返回 HTTP 响应（warp）"
"form" = "解析表单数据（warp/rocket）"
"Parser" = "派生宏：让结构体自动解析命令行参数（clap）"
"Command" = "clap 的命令行解析器，手动构建子命令和参数"
"Arg" = "clap 的命令行参数定义"
"Subcommand" = "子命令定义（如 git commit 里的 commit）"
"ValueEnum" = "派生宏：让枚举作为参数的可选值（clap）"
"long" = "定义长参数，如 --name（clap）"
"short" = "定义短参数，如 -n（clap）"
"help" = "参数的帮助文本（clap）"
"required" = "标记参数为必填（clap）"
"default_value" = "参数缺省时使用的默认值（clap）"
