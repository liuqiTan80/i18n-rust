[package]
name = "i18n-rust-lsp"
version = "0.5.6"
edition = "2024"
description = "LSP 代理服务器：将方言 Rust 代码翻译为标准 Rust 后交给 rust-analyzer"
license = "MIT"
repository = "https://gitcode.com/tan80/zrRust"

[dependencies]
# LSP 协议
lsp-server = "0.7"
lsp-types = "0.95"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 界面消息解析
toml = "0.8"

# 日志
log = "0.4"
env_logger = "0.11"

# 跨线程通道
crossbeam-channel = "0.5"

# 内部引擎（发布时 path 自动转为 crates.io 版本依赖，故必须显式声明版本）
i18n-rust-engine = { path = "../engine", version = "0.5.6" }

# 词法分析（列映射用）
rustc_lexer = "0.1"

# 工具
anyhow = "1"
tempfile = "3"
