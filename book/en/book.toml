# =============================================================
# rzc 文档站 · 英文书（mdBook）
#
# src/ 由 tools/build-site.py 构建时组装（教程来自 ../../tutorials/en/，
# README.md 除外）；配置/SUMMARY/index 随仓库提交。本地构建：make site
# =============================================================
[book]
title = "rzc Tutorials · Write Rust in your native language"
language = "en"
src = "src"
create-missing = false

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/liuqiTan80/i18n-rust"
additional-js = ["lang-switch.js"]
site-url = "/i18n-rust/en/"

[output.html.fold]
enable = true

[output.html.playground]
# 英文教程代码即标准 Rust，但骨架阶段统一禁用运行按钮（离线/一致的阅读体验）
editable = false
runnable = false
