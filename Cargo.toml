[workspace]
members = [
    "crates/engine",
    "crates/cli",
    "crates/lsp",
    # 纯函数方言测试样例（不发布）：tests-zh/*.zh 由 build.rs 转译后随 cargo test 执行
    "crates/zh-pure",
]
resolver = "2"

# 支持的最低 Rust 版本（对齐代码使用的 let-chains / is_none_or 等特性）
[workspace.package]
rust-version = "1.88"

# 跨 crate 共享依赖统一在此声明版本，各 crate 用 `dep.workspace = true` 引用，
# 避免多 crate 重复声明导致版本漂移
[workspace.dependencies]
rustc_lexer = "0.1"
# preserve_order 是硬需求：诊断反查表按「同一英文值的多个母语同义词取书写序首条」
# 决定胜出者（见 diagnostic::build_type_map）。toml 1.x 换掉了 0.8 的 toml_edit 后端，
# 默认表为按键排序的 BTreeMap，书写序会丢（ja 的 Display 会从「表示可能」翻成「表示」）
toml = { version = "1.1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
anyhow = "1"
tempfile = "3"

# 发布优化：离线分发包体积与运行性能
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# clippy 规则落库：本地 `cargo clippy` 与 CI 的 `-D warnings` 门禁行为一致，
# 贡献者提交前即可发现告警（CI 仍显式传 -D warnings 作为双保险）
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
