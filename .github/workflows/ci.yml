# =============================================================
# i18n-rust 持续集成工作流（GitHub Actions / GitCode CI 兼容）
#
# 触发条件：
#   - 推送任意分支（push）
#   - 创建或更新 Pull Request（pull_request）
#
# 任务：
#   1. 测试与质量：cargo test（全部 crate）+ cargo clippy 代码质量检查
#   2. MSRV 门禁：声明的最低 Rust 版本（1.88）下工作区可编译
#   3. LSP 端到端测试：安装 rust-analyzer 后验证真实诊断的中文翻译链路
#   4. 基准回归对比：转译管线基准与入库基线对比，超阈值时失败
#   5. 三平台构建：Linux / macOS / Windows 的 release 二进制
#      （rzc 命令行工具 + i18n-rust-lsp 语言服务器）
#   6. VS Code 扩展打包：编译 TypeScript 并生成 .vsix 离线安装包
#   7. 测试覆盖率门禁：llvm-cov 行覆盖率低于 70% 时失败
#
# 全部产物上传为 Artifact，供手动下载或发布工作流复用。
#
# 说明：
#   - GitCode CI 兼容 GitHub Actions 语法，本文件可直接使用；
#   - clippy 以 -D warnings 门禁（当前工作区已保持零警告）；
#   - 依赖漏洞审计使用 rustsec/audit-check（基于 RustSec 公告库）。
# =============================================================
name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支的重复推送取消旧运行，避免并发浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. 测试与代码质量 ----------
  test:
    name: 测试与代码质量
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 clippy 与 rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: 运行单元测试（debug，锁定依赖）
        run: cargo test --workspace --locked

      - name: 运行单元测试（release 优化）
        # release 模式下的测试此前从未运行，可暴露仅在优化下出现的
        # 数值/溢出/内联行为差异
        run: cargo test --workspace --release --locked

      - name: 运行 Clippy 代码质量检查（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 验证 mapping auto 帮助文本
        # 工作区含 rzc 与 i18n-rust-lsp 两个二进制，必须用 --bin 指定
        run: cargo run --quiet --bin rzc -- mapping auto --help | grep -q "crate"

      - name: 第三方库映射质量门禁
        # 校验全部内置语言包的 crates 映射：重复键 / 关键字避让 /
        # 跨文件同键冲突 / 跨语言条目数一致性（发现 error 时退出码非零），
        # 并对照告警基线（tools/mapping-baseline.json）校验告警数只减不增
        run: |
          cargo build --quiet --bin rzc
          python3 tools/check-mapping-warnings.py

      - name: ui.toml 键完备性检查
        # 以 zh 为基准逐语言比对：界面消息键缺失 / 界面消息键误放「解释」段 /
        # 共有键 {} 占位符数量不一致时退出码非零（防止新增键只补部分语言）
        run: python3 tools/check-ui-keys.py

      - name: README 结构 parity 检查（9 份翻译 vs en 基准）
        # 校验 9 份翻译 README 的 h1/h2/h3 章节数、页内锚点有效性、
        # 代码围栏配对、「从这里开始」导航行链接与必需结构元素——
        # 防止章节漂移与锚点失效（新增章节只改基准、emoji 标题锚点回归等）
        run: python3 tools/check-readme-parity.py

      - name: 教程代码块验证（单块编译 + 预期错误码断言，zh/en/ja/ru）
        # 逐个验证 tutorials/*.md 代码块：完整程序/片段须编译通过，
        # 错误示例须编译失败且实际错误码与 `// 预期错误: EXXXX` 标记一致；
        # 非预期失败时退出码非零。白名单（tools/expected-failures.json）
        # 仅豁免教程结构固有噪音（跨块上下文依赖/环境依赖等）
        run: |
          cargo build --quiet --bin rzc
          python3 tools/verify-tutorials.py --allowlist tools/expected-failures.json
          for lang in en ja ru; do
            python3 tools/verify-tutorials.py --dir "tutorials/$lang" --lang "$lang" \
              --allowlist tools/expected-failures.json
          done

      - name: 术语表与语言包一致性检查
        # 术语表「对应关键字/宏/方法/…」引用必须能在 zh 语言包找到对应键，
        # 防止教程索引与转译事实来源漂移（学习者按术语表写代码却无法转译）
        run: python3 tools/verify-glossary.py

  # ---------- 2. MSRV 门禁（声明的最低 Rust 版本可编译） ----------
  msrv:
    name: MSRV 1.88 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装最低支持版本工具链
        uses: dtolnay/rust-toolchain@1.88

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译全部 crate（debug，锁定依赖）
        # 与 Cargo.toml 的 [workspace.package] rust-version 对齐：
        # 代码使用的 let-chains（1.88）/ is_none_or（1.82）等特性不被破坏。
        # 显式 +1.88：覆盖 rust-toolchain.toml（stable），防止 MSRV 门禁被静默绕过
        run: cargo +1.88 build --workspace --locked

  # ---------- 2.6 测试覆盖率门禁（llvm-cov 行覆盖率下限） ----------
  coverage:
    name: 测试覆盖率门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 LLVM 工具）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 覆盖率门禁（行覆盖率低于 70% 时失败）
        # 当前基线 73.6%（2026-09 llvm-cov 实测；引擎各模块 90%+，CLI/LSP 命令
        # 入口等协议胶水层难以单测属预期）。实测未达 80%，故维持 70% 阈值——
        # 留余量防止小改动偶发触发，但能拦截大段未测代码；CLI 集成测试补齐后
        # 可逐步上调
        run: cargo llvm-cov --workspace --fail-under-lines 70 --html

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: 覆盖率报告
          path: target/llvm-cov/html
          if-no-files-found: warn

  # ---------- 3. 依赖漏洞审计（RustSec 公告库） ----------
  audit:
    name: 依赖漏洞审计
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit（扫描 Cargo.lock 已知漏洞）
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 4. LSP 端到端测试（真实 rust-analyzer + 中文诊断翻译） ----------
  # 三平台矩阵：真实诊断翻译链路在 Linux / Windows / macOS 上均有覆盖
  # （工具链安装与 e2e 测试均已跨平台：Windows 用 zip 资产与 .exe 后缀）
  lsp-e2e:
    name: LSP 端到端测试 ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: windows-latest
            os_name: windows
          - os: macos-latest
            os_name: macos
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建 rzc（用于安装 rust-analyzer）
        run: cargo build --quiet --bin rzc --locked

      - name: 安装 rust-analyzer（--ra-only 仅下载分析器，跳过 300MB rustc）
        # 安装在 ~/.rz/toolchain/bin，与 engine::toolchain 的查找顺序一致；
        # shell: bash 保证三平台命令一致（Windows 上 Git Bash 自动补 .exe）
        shell: bash
        run: ./target/debug/rzc install toolchain --ra-only --force

      - name: 运行 LSP 端到端测试（显式启用 ignored 测试）
        # e2e 测试需要 rust-analyzer 可执行文件，默认 #[ignore] 跳过；
        # 此处先安装工具链再显式运行，验证 E0425 诊断的翻译全链路。
        # 失败时把关键日志转为 ::error:: 注解（可经 annotations API 匿名
        # 读取，便于无 GitHub 登录时定位失败）；完整日志同时留在 e2e-full.log
        shell: bash
        run: |
          set +e
          cargo test -p i18n-rust-lsp --test e2e -- --ignored 2>&1 | tee e2e-full.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/e2e-failure-annotations.sh e2e-full.log "${{ matrix.os_name }}" || true
          fi
          exit "$status"

  # ---------- 5. 基准回归对比 ----------
  bench:
    name: 基准回归对比
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 运行基准并对比入库基线（超阈值时失败）
        # 基线：crates/engine/benches/baseline.json（转译管线）与
        # crates/lsp/benches/baseline.json（LSP 热路径）（开发者用
        # tools/bench-check.sh --update 刷新后随仓库提交）；
        # 阈值：本地默认 30%；CI 复用共享 runner（邻租户负载干扰大），
        # 同一提交实测波动可超 60%，故 CI 放宽到 100% 只拦灾难性回归，
        # 精细对比留给开发者本地（BENCH_REGRESSION_PCT 默认 30）。
        # 首次失败自动重跑一次（共享 runner 偶发噪声），仍超阈值才判失败
        env:
          BENCH_REGRESSION_PCT: "100"
        run: |
          if ! tools/bench-check.sh; then
            echo "::warning title=基准首次运行超阈值::自动重跑一次以排除共享 runner 噪声"
            tools/bench-check.sh
          fi

      - name: 上传基准报告
        uses: actions/upload-artifact@v4
        with:
          name: 基准报告
          path: target/criterion
          if-no-files-found: warn

  # ---------- 6. 三平台 release 二进制构建 ----------
  build:
    name: 构建并测试 ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
          - os: windows-latest
            os_name: windows
            arch: x86_64
          # macOS arm64 运行器（Intel 用户可自行添加 macos-13 + x86_64 条目）
          - os: macos-latest
            os_name: macos
            arch: aarch64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译全部 crate（release，锁定依赖）
        run: cargo build --release --workspace --locked

      - name: 二进制冒烟测试（--version / --help）
        # 三个平台各自验证产物可执行，捕获链接/平台问题
        run: |
          ./target/release/rzc --version
          ./target/release/i18n-rust-lsp --version

      - name: 平台相关单测（Linux/Windows）
        if: matrix.os_name != 'macos'
        run: cargo test --release -p rzc -p i18n-rust-lsp --locked

      # macOS 侧曾出现测试失败但无日志权限定位难；拆成模块级探针，
      # 失败时从步级结论即可定位到具体模块（探针间无状态依赖）。
      - name: 平台单测·探针0 编译测试二进制（macos）
        if: matrix.os_name == 'macos'
        run: cargo test --release --locked -p rzc -p i18n-rust-lsp --no-run

      - name: 平台单测·探针1 lsp analyzer 模块（macos）
        if: matrix.os_name == 'macos'
        run: cargo test --release --locked -p i18n-rust-lsp -- analyzer

      - name: 平台单测·探针2 lsp 其余模块（macos）
        # lsp 为 bin-only crate（无 lib target）：不可加 --lib，否则报
        # “no library targets found” 假失败（此前诊断组即因此误报）
        if: matrix.os_name == 'macos'
        run: cargo test --release --locked -p i18n-rust-lsp -- --skip analyzer

      - name: 平台单测·探针3 rzc lang_manager 模块（macos）
        if: matrix.os_name == 'macos'
        run: cargo test --release --locked -p rzc -- lang_manager

      - name: 平台单测·探针4 rzc 其余模块（macos）
        if: matrix.os_name == 'macos'
        run: cargo test --release --locked -p rzc -- --skip lang_manager

      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: 二进制-${{ matrix.os_name }}-${{ matrix.arch }}
          # 通配匹配：Linux/macOS 为 rzc，Windows 为 rzc.exe
          path: |
            target/release/rzc*
            target/release/i18n-rust-lsp*
          if-no-files-found: error

  # ---------- 7. VS Code 扩展打包 ----------
  vsix:
    name: 构建 VS Code 扩展
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（使用锁定依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: 安装依赖（锁定版本，保证可复现）
        working-directory: tools/vscode-extension
        run: npm ci

      - name: 检查与测试（lint + 单测）
        working-directory: tools/vscode-extension
        run: |
          npm run lint
          npm test

      - name: 语法文件与语言包同步检查
        # 重新生成全部 10 份 tmLanguage 后检查 diff：keywords.toml / lang_info.toml
        # 的改动必须同步反映到 syntaxes/（语法高亮漂移拦截门禁）
        working-directory: tools/vscode-extension
        run: |
          npm run gen:grammars
          if ! git diff --exit-code --quiet -- syntaxes/; then
            echo "❌ 语法文件与语言包不同步：请运行 npm run gen:grammars 并提交生成的语法文件"
            git diff --stat -- syntaxes/
            exit 1
          fi
          echo "✅ 语法文件与语言包同步"

      - name: 编译 TypeScript
        working-directory: tools/vscode-extension
        run: npm run compile

      - name: 打包 .vsix
        working-directory: tools/vscode-extension
        # release/ 目录已加入 .gitignore（不再被 git 跟踪），checkout 后不存在，需先创建；
        # --no-install 使用 npm ci 安装的锁定版本 @vscode/vsce，避免浮动最新版打出的包不一致
        run: |
          mkdir -p ../../release/
          npx --no-install @vscode/vsce package --out ../../release/ --baseContentUrl https://gitcode.com/tan80/i18n-rust/raw/main/tools/vscode-extension/ --baseImagesUrl https://gitcode.com/tan80/i18n-rust/raw/main/tools/vscode-extension/

      - name: 上传扩展包产物
        uses: actions/upload-artifact@v4
        with:
          name: VSIX扩展包
          path: release/*.vsix
          if-no-files-found: error
