# =============================================================
# i18n-rust 发布工作流（GitHub Actions / GitCode CI 兼容）
#
# 触发条件：
#   - 推送 v 开头 tag（如 v0.1.0）：
#       构建三平台 rzc 离线包 + VS Code 扩展 .vsix，
#       创建 Release 并上传全部产物；同时发布 crates.io
#       （需配置 CARGO_REGISTRY_TOKEN 密钥）
#   - 手动触发（workflow_dispatch）：
#       仅构建并上传 Artifact，不创建 Release；
#       勾选"发布到 crates.io"可额外执行 crates.io 发布
#
# 产物：
#   rzc-<版本>-linux-x86_64.tar.gz     （rzc + 语言包 + 文档）
#   rzc-<版本>-windows-x86_64.zip
#   rzc-<版本>-macos-aarch64.tar.gz
#   i18n-rust-<版本>.vsix             （VS Code 扩展离线安装包）
#
# 说明：
#   - 本文件双平台通用（GitHub Actions / GitCode CI）：
#     · GitHub 镜像仓库（liuqiTan80/i18n-rust）：用官方 action 创建
#       GitHub Release（GITHUB_TOKEN 自动注入，无需额外配置）；
#     · GitCode 主仓库（tan80/zrRust）：用 GitCode 开放 API（OpenAPI v5）
#       创建 Release，产物落在 https://gitcode.com/tan80/zrRust/releases
#       ——与 README 中"从 Releases 下载"的引导一致；
#   - GitCode 侧需在仓库 Secrets 配置 GITCODE_TOKEN（头像 → 设置 → 私人令牌，
#     需 releases 权限）；crates.io 需配置 CARGO_REGISTRY_TOKEN（发布步骤
#     未配置时自动跳过，不阻塞其他 job）；
#   - crates.io 发布顺序固定为 i18n-rust-engine → i18n-rust-lsp → rzc：
#     rzc 与 i18n-rust-lsp 依赖核心引擎，必须先发布依赖。
# =============================================================
name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 手动触发时是否发布到 crates.io（需配置 CARGO_REGISTRY_TOKEN 密钥）
        type: boolean
        default: false

jobs:
  # ---------- 构建：三个平台各自编译并打包 rzc 离线包 ----------
  package:
    name: 构建离线包 ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
          - os: windows-latest
            os_name: windows
            arch: x86_64
          # macOS arm64 运行器（Intel 用户可自行添加 macos-13 + x86_64 条目）
          - os: macos-latest
            os_name: macos
            arch: aarch64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 编译 rzc 与语言服务器（release）
        run: cargo build --release -p rzc -p i18n-rust-lsp

      - name: 组装发布目录
        shell: bash
        run: |
          # 注意：bash 变量名必须为 ASCII（中文变量名会被当作命令执行）
          VERSION="${GITHUB_REF_NAME#v}"
          # 手动触发（无 tag）时回退到 Cargo.toml 中的版本号
          if [ "$VERSION" = "$GITHUB_REF_NAME" ] || [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)
          fi
          PKG_NAME="rzc-$VERSION-${{ matrix.os_name }}-${{ matrix.arch }}"
          DIR="release/$PKG_NAME"
          mkdir -p "$DIR/lang-packs"

          # 可执行文件（Windows 下为 rzc.exe）
          cp target/release/rzc "$DIR/rzc" 2>/dev/null || cp target/release/rzc.exe "$DIR/rzc.exe"

          # 语言服务器（VS Code 扩展后端；与 rzc 同目录，`rzc install lsp` 可免网络直接安装）
          cp target/release/i18n-rust-lsp "$DIR/i18n-rust-lsp" 2>/dev/null || cp target/release/i18n-rust-lsp.exe "$DIR/i18n-rust-lsp.exe"

          # 语言包目录（可选扩展：远程安装的语言包；中文等已内置到可执行文件）；
          # 单一数据源为 crates/engine/lang-packs/，包内仍按 lang-packs/ 布局（RZ_LANG_DIR 约定）
          if [ -d crates/engine/lang-packs ]; then
            cp -r crates/engine/lang-packs/. "$DIR/lang-packs/"
          fi

          # 许可证与说明文档
          [ -f LICENSE ] && cp LICENSE "$DIR/" || true
          [ -f README.md ] && cp README.md "$DIR/" || true          # 内置工具链（standalone rustc/cargo/rust-analyzer）：离线包即开即用，无需 rustup
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            TRIPLE="x86_64-pc-windows-msvc"
          elif [ "${{ matrix.os_name }}" = "linux" ]; then
            TRIPLE="x86_64-unknown-linux-gnu"
          else
            TRIPLE="aarch64-apple-darwin"
          fi
          mkdir -p "$DIR/toolchain/bin"
          RUST_DIST="https://static.rust-lang.org/dist/rust-$VERSION-$TRIPLE.tar.gz"
          echo "下载工具链: $RUST_DIST"
          curl -sL "$RUST_DIST" -o /tmp/rust.tar.gz
          tar -xzf /tmp/rust.tar.gz -C /tmp
          cp /tmp/rust-$VERSION-$TRIPLE/rustc/bin/* "$DIR/toolchain/bin/" 2>/dev/null || true
          cp /tmp/rust-$VERSION-$TRIPLE/cargo/bin/* "$DIR/toolchain/bin/" 2>/dev/null || true
          # rust-analyzer（官方 Release，锁定 tag；rzc install toolchain 同源）
          RA_TAG="2026-08-24"
          RA_NAME="rust-analyzer-$TRIPLE"
          [ "${{ matrix.os_name }}" = "windows" ] && RA_NAME="$RA_NAME.exe"
          curl -sL "https://github.com/rust-lang/rust-analyzer/releases/download/$RA_TAG/$RA_NAME" -o "$DIR/toolchain/bin/$RA_NAME"
          chmod +x "$DIR/toolchain/bin/"* 2>/dev/null || true
          echo "工具链已打包：$(ls "$DIR/toolchain/bin")"

          # 使用说明
          cat > "$DIR/使用说明.md" <<'说明'
          # rzc 离线发布包使用说明

          ## 快速开始

          - **Linux / macOS**：直接运行 `./rzc`
          - **Windows**：运行 `rzc.exe`

          中文语言包已内置到可执行文件中，开箱即用，无需任何配置。

          ## 常用命令

          ```bash
          ./rzc init 我的项目      # 创建新项目（含 src/main.zh）
          ./rzc run src/main.zh   # 翻译并运行中文代码
          ./rzc check src/main.zh # 类型检查（中文错误提示）
          ./rzc lang list         # 查看语言包
          ./rzc install lsp       # 安装语言服务器（VS Code 扩展后端，包内免网络复制）          ## 内置工具链

          包内 `toolchain/bin/` 已附带官方 standalone rustc/cargo/rust-analyzer，
          开箱即用，无需安装 rustup 或配置 PATH：

          ```bash
          ./rzc install toolchain --force  # 就地安装内置工具链（包内免网络复制）
          ./rzc doctor                     # 查看工具链状态
          ```
          ```

          ## 可选：使用包内语言包目录

          包内附带的 `lang-packs/` 目录用于扩展（例如后续远程安装的其他语言包）。
          如需使用，将环境变量 `RZ_LANG_DIR` 指向该目录：

          ```bash
          export RZ_LANG_DIR="$(pwd)/lang-packs"
          ```

          ## 系统要求

          - 包内已含完整工具链（rustc/cargo/rust-analyzer），无需安装 Rust 环境
          - Linux：glibc 2.31+；macOS：11.0+；Windows：10 1803+
          说明

          echo "组装完成：$DIR"

      - name: 打包压缩
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ] || [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version = ' crates/cli/Cargo.toml | cut -d'"' -f2)
          fi
          PKG_NAME="rzc-$VERSION-${{ matrix.os_name }}-${{ matrix.arch }}"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            # Windows 运行器的 tar 为 bsdtar，-a 按 .zip 扩展名自动选择 zip 格式
            (cd release && tar -a -c -f "$PKG_NAME.zip" "$PKG_NAME")
          else
            tar -czf "release/$PKG_NAME.tar.gz" -C release "$PKG_NAME"
          fi
          echo "打包完成：release/ 下的产物为："
          ls -lh release/

      - name: 上传构建产物（供发布步骤使用）
        uses: actions/upload-artifact@v4
        with:
          name: 离线包-${{ matrix.os_name }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  # ---------- VS Code 扩展打包 ----------
  vsix:
    name: 构建 VS Code 扩展
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（使用锁定依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: 安装依赖（锁定版本，保证可复现）
        working-directory: tools/vscode-extension
        run: npm ci

      - name: 检查与测试（lint + 单测）
        working-directory: tools/vscode-extension
        run: |
          npm run lint
          npm test

      - name: 编译 TypeScript
        working-directory: tools/vscode-extension
        run: npm run compile

      - name: 打包 .vsix
        working-directory: tools/vscode-extension
        # release/ 目录已加入 .gitignore（不再被 git 跟踪），checkout 后不存在，需先创建
        run: |
          mkdir -p ../../release/
          npx --yes @vscode/vsce package --out ../../release/ --baseContentUrl https://gitcode.com/tan80/zrRust/raw/main/tools/vscode-extension/ --baseImagesUrl https://gitcode.com/tan80/zrRust/raw/main/tools/vscode-extension/

      - name: 上传扩展包产物（供发布步骤使用）
        uses: actions/upload-artifact@v4
        with:
          name: VSIX扩展包
          path: release/*.vsix
          if-no-files-found: error

  # ---------- 发布：推送 tag 时创建 Release 并附带全部产物 ----------
  publish:
    name: 创建 Release 并上传产物
    needs: [package, vsix]
    # 仅 tag 触发时发布；手动触发只产出 Artifact
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 显式声明写权限：创建 Release/上传附件需要 contents: write
    # （仓库 Actions 默认权限为只读时，不加此声明会 403 失败）
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts/

      # GitHub 镜像仓库：官方 action 创建 GitHub Release（GITHUB_TOKEN 自动注入）
      - name: 创建 GitHub Release 并上传附件
        if: github.repository == 'liuqiTan80/i18n-rust'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # GitCode 主仓库：GitCode 开放 API 创建 GitCode Release（与 README 下载引导一致）：
      # 与 Gitee OpenAPI v5 兼容，创建 Release 后逐个上传附件（三平台离线包 + vsix）。
      - name: 创建 GitCode Release 并上传附件
        if: github.repository != 'liuqiTan80/i18n-rust'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          API="https://api.gitcode.com/api/v5/repos/tan80/zrRust"
          AUTH="Authorization: token ${GITCODE_TOKEN}"
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 1) 按 tag 查找已存在的 Release，不存在则创建
          RESP="$(curl -s -H "$AUTH" "$API/releases/tags/$TAG?access_token=${GITCODE_TOKEN}")"
          RELEASE_ID="$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)"
          if [ -z "$RELEASE_ID" ]; then
            RESP="$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"rzc $VERSION\",\"body\":\"i18n-rust $VERSION 发布产物：三平台离线包与 VS Code 扩展\",\"prerelease\":false}" \
              "$API/releases?access_token=${GITCODE_TOKEN}")"
            RELEASE_ID="$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)"
          fi
          [ -n "$RELEASE_ID" ] || { echo "创建 Release 失败：$RESP"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          # 2) 上传全部附件（离线包 + vsix）
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            echo "上传附件：$f"
            curl -s -X POST -H "$AUTH" -F "access_token=${GITCODE_TOKEN}" -F "file=@$f" \
              "$API/releases/$RELEASE_ID/attach_files"
            echo
          done
          ls -lh artifacts/

  # ---------- 发布 crates.io（需配置 CARGO_REGISTRY_TOKEN 密钥） ----------
  # 注意：if 条件中不可引用 secrets 上下文（GitHub Actions 限制），
  # 故用 job 级 env 注入令牌，发布步骤以 env 非空判断是否执行。
  crates:
    name: 发布 crates.io
    needs: package
    # tag 触发时自动发布；手动触发需勾选"发布到 crates.io"
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_crates) || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 登录 crates.io（未配置令牌时跳过）
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo login "$CARGO_REGISTRY_TOKEN"

      # 发布顺序依赖：引擎库 → LSP 代理 → 命令行工具；
      # 双平台（GitCode/GitHub）CI 并行发布同一版本时先到先得，
      # 已存在（另一平台已发布）则跳过，避免重复发布报错。
      - name: 发布三个 crate 到 crates.io（已存在则跳过）
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          VERSION="$(grep -m1 '^version = ' crates/engine/Cargo.toml | cut -d'"' -f2)"
          for CRATE in i18n-rust-engine i18n-rust-lsp rzc; do
            EXIST="$(curl -s -A "rzc-ci" "https://crates.io/api/v1/crates/$CRATE" | grep -o "\"max_stable_version\":\"$VERSION\"" || true)"
            if [ -n "$EXIST" ]; then
              echo "跳过 $CRATE：$VERSION 已存在于 crates.io"
            else
              echo "发布 $CRATE $VERSION ..."
              cargo publish -p "$CRATE"
            fi
          done
