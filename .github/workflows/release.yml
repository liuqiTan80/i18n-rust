# =============================================================
# i18n-rust 发布工作流（GitHub Actions / GitCode CI 兼容）
#
# 触发条件：
#   - 推送 v 开头 tag（如 v0.1.0）：
#       构建 VS Code 扩展 .vsix 并创建 Release 上传；
#       同时发布 crates.io（需配置 CARGO_REGISTRY_TOKEN 密钥）
#   - 手动触发（workflow_dispatch）：
#       仅构建并上传 Artifact，不创建 Release；
#       勾选"发布到 crates.io"可额外执行 crates.io 发布
#
# 产物：
#   i18n-rust-<版本>.vsix             （VS Code 扩展离线安装包）
#   （rzc 离线发布包不在 CI 构建：由本地脚本 release-offline.sh/.ps1
#     编译打包后手动上传到 Release / 网盘）
#
# 说明：
#   - 本文件双平台通用（GitHub Actions / GitCode CI）：
#     · GitHub 镜像仓库（liuqiTan80/i18n-rust）：用官方 action 创建
#       GitHub Release（GITHUB_TOKEN 自动注入，无需额外配置）；
#     · GitCode 主仓库（tan80/i18n-rust）：用 GitCode 开放 API（OpenAPI v5）
#       创建 Release，产物落在 https://gitcode.com/tan80/i18n-rust/releases
#       ——与 README 中"从 Releases 下载"的引导一致；
#   - GitCode 侧需在仓库 Secrets 配置 GITCODE_TOKEN（头像 → 设置 → 私人令牌，
#     需 releases 权限）；crates.io 需配置 CARGO_REGISTRY_TOKEN（发布步骤
#     未配置时自动跳过，不阻塞其他 job）；
#   - crates.io 发布顺序固定为 i18n-rust-engine → i18n-rust-lsp → rzc：
#     rzc 与 i18n-rust-lsp 依赖核心引擎，必须先发布依赖。
# =============================================================
name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 手动触发时是否发布到 crates.io（需配置 CARGO_REGISTRY_TOKEN 密钥）
        type: boolean
        default: false

jobs:
  # ---------- 0. 发布前置质量门禁：任一失败中止 package/vsix/crates ----------
  check:
    name: 发布质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 clippy 与 rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: Clippy（警告视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试（debug + release，锁定依赖）
        run: |
          cargo test --workspace --locked
          cargo test --workspace --release --locked

      - name: 第三方库映射质量门禁
        run: cargo run --quiet --bin rzc -- mapping check

      - name: 版本一致性校验（三 crate == 扩展 == tag，CHANGELOG 有对应条目）
        run: |
          set -e
          V="$(grep -m1 '^version = ' crates/engine/Cargo.toml | cut -d'"' -f2)"
          for C in crates/engine crates/cli crates/lsp; do
            CV="$(grep -m1 '^version = ' "$C/Cargo.toml" | cut -d'"' -f2)"
            [ "$CV" = "$V" ] || { echo "❌ $C 版本 $CV 与引擎 $V 不一致"; exit 1; }
          done
          JSV="$(grep -m1 '"version"' tools/vscode-extension/package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ "$JSV" = "$V" ] || { echo "❌ 扩展版本 $JSV 与 Rust 侧 $V 不一致"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            [ "$TAG" = "$V" ] || { echo "❌ tag v$TAG 与版本 $V 不一致"; exit 1; }
          fi
          grep -q "^## $V" tools/vscode-extension/CHANGELOG.md || { echo "❌ CHANGELOG 缺少 $V 条目"; exit 1; }
          echo "✅ 版本一致：$V"

  # ---------- VS Code 扩展打包 ----------
  vsix:
    name: 构建 VS Code 扩展
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（使用锁定依赖缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: 安装依赖（锁定版本，保证可复现）
        working-directory: tools/vscode-extension
        run: npm ci

      - name: 检查与测试（lint + 单测）
        working-directory: tools/vscode-extension
        run: |
          npm run lint
          npm test

      - name: 编译 TypeScript
        working-directory: tools/vscode-extension
        run: npm run compile

      - name: 打包 .vsix
        working-directory: tools/vscode-extension
        # release/ 目录已加入 .gitignore（不再被 git 跟踪），checkout 后不存在，需先创建；
        # --no-install 使用 npm ci 安装的锁定版本 @vscode/vsce，避免浮动最新版打出的包不一致
        run: |
          mkdir -p ../../release/
          npx --no-install @vscode/vsce package --out ../../release/ --baseContentUrl https://gitcode.com/tan80/i18n-rust/raw/main/tools/vscode-extension/ --baseImagesUrl https://gitcode.com/tan80/i18n-rust/raw/main/tools/vscode-extension/

      - name: 上传扩展包产物（供发布步骤使用）
        uses: actions/upload-artifact@v4
        with:
          name: VSIX扩展包
          path: release/*.vsix
          if-no-files-found: error

  # ---------- 发布：推送 tag 时创建 Release 并附带全部产物 ----------
  publish:
    name: 创建 Release 并上传产物
    needs: [vsix]
    # 仅 tag 触发时发布；手动触发只产出 Artifact。
    # rzc 离线发布包由发布者按本地脚本（release-offline.sh/.ps1）
    # 编译后手动上传到本 Release（或网盘）。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 显式声明写权限：创建 Release/上传附件需要 contents: write
    # （仓库 Actions 默认权限为只读时，不加此声明会 403 失败）
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts/

      # GitHub 镜像仓库：官方 action 创建 GitHub Release（GITHUB_TOKEN 自动注入）
      - name: 创建 GitHub Release 并上传附件
        if: github.repository == 'liuqiTan80/i18n-rust'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # GitCode 主仓库：GitCode 开放 API 创建 GitCode Release（与 README 下载引导一致）：
      # 与 Gitee OpenAPI v5 兼容，创建 Release 后逐个上传附件（三平台离线包 + vsix）。
      - name: 创建 GitCode Release 并上传附件
        if: github.repository != 'liuqiTan80/i18n-rust'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          API="https://api.gitcode.com/api/v5/repos/tan80/i18n-rust"
          AUTH="Authorization: token ${GITCODE_TOKEN}"
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 1) 按 tag 查找已存在的 Release，不存在则创建
          RESP="$(curl -s -H "$AUTH" "$API/releases/tags/$TAG?access_token=${GITCODE_TOKEN}")"
          RELEASE_ID="$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)"
          if [ -z "$RELEASE_ID" ]; then
            RESP="$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"rzc $VERSION\",\"body\":\"i18n-rust $VERSION 发布产物：三平台离线包与 VS Code 扩展\",\"prerelease\":false}" \
              "$API/releases?access_token=${GITCODE_TOKEN}")"
            RELEASE_ID="$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)"
          fi
          [ -n "$RELEASE_ID" ] || { echo "创建 Release 失败：$RESP"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          # 2) 上传全部附件（当前为 vsix；rzc 离线包由发布者手动上传）
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            echo "上传附件：$f"
            curl -s -X POST -H "$AUTH" -F "access_token=${GITCODE_TOKEN}" -F "file=@$f" \
              "$API/releases/$RELEASE_ID/attach_files"
            echo
          done
          ls -lh artifacts/

  # ---------- 发布 crates.io（需配置 CARGO_REGISTRY_TOKEN 密钥） ----------
  # 注意：if 条件中不可引用 secrets 上下文（GitHub Actions 限制），
  # 故用 job 级 env 注入令牌，发布步骤以 env 非空判断是否执行。
  crates:
    name: 发布 crates.io
    needs: [check]
    # tag 触发时自动发布；手动触发需勾选"发布到 crates.io"
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_crates) || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 登录 crates.io（未配置令牌时跳过）
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo login "$CARGO_REGISTRY_TOKEN"

      # 发布顺序依赖：引擎库 → LSP 代理 → 命令行工具；
      # 双平台（GitCode/GitHub）CI 并行发布同一版本时先到先得，
      # 已存在（另一平台已发布）则跳过，避免重复发布报错。
      - name: 发布三个 crate 到 crates.io（已存在则跳过）
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          VERSION="$(grep -m1 '^version = ' crates/engine/Cargo.toml | cut -d'"' -f2)"
          for CRATE in i18n-rust-engine i18n-rust-lsp rzc; do
            EXIST="$(curl -s -A "rzc-ci" "https://crates.io/api/v1/crates/$CRATE" | grep -o "\"max_stable_version\":\"$VERSION\"" || true)"
            if [ -n "$EXIST" ]; then
              echo "跳过 $CRATE：$VERSION 已存在于 crates.io"
            else
              echo "发布 $CRATE $VERSION ..."
              # 发布前 dry-run 校验（含 --locked：锁文件必须与清单一致）
              cargo publish -p "$CRATE" --dry-run --locked
              cargo publish -p "$CRATE" --locked
            fi
          done
