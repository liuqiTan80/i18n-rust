[package]
name = "i18n-rust-lsp"
version = "0.1.0"
edition = "2024"
description = "LSP 代理服务器：将中文 Rust 代码翻译为标准 Rust 后交给 rust-analyzer"

[dependencies]
# LSP 协议
lsp-server = "0.7"
lsp-types = "0.95"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# 跨线程通道
crossbeam-channel = "0.5"

# 内部引擎
i18n-rust-engine = { path = "../../核心/引擎" }

# 词法分析（列映射用）
rustc_lexer = "0.1"

# 工具
anyhow = "1"
tempfile = "3"
