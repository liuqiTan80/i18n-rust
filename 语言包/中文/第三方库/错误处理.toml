# i18n-rust 错误处理库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# anyhow - 通用错误处理
# ============================================
[anyhow]
"任意错误" = "anyhow::Error"
"结果" = "anyhow::Result"
"上下文" = "context"
"确保" = "ensure"
"错误" = "bail"

# ============================================
# thiserror - 错误类型派生
# ============================================
[thiserror]
"错误" = "error"
"来源" = "source"
"显示" = "display"

# ============================================
# color-eyre - 彩色错误报告
# ============================================
[color_eyre]
"结果" = "color_eyre::Result"
"安装" = "install"
"报告" = "Report"

# ============================================
# snafu - 错误上下文
# ============================================
[snafu]
"确保" = "ensure"
"返回" = "return"
"上下文" = "context"
