# i18n-rust 日志库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# tracing - 结构化日志
# ============================================
[tracing]
"追踪" = "trace"
"调试" = "debug"
"信息" = "info"
"警告" = "warn"
"错误" = "error"
"跨度" = "span"
"事件" = "event"
"订阅者" = "subscriber"
"初始化" = "init"

# ============================================
# log - 日志门面
# ============================================
[log]
"追踪" = "trace"
"调试" = "debug"
"信息" = "info"
"警告" = "warn"
"错误" = "error"
"日志级别" = "Level"
"日志记录" = "Record"

# ============================================
# env_logger - 环境变量日志
# ============================================
[env_logger]
"初始化" = "init"
"构建器" = "Builder"
"过滤器" = "filter"

# ============================================
# tracing-subscriber - 日志订阅者
# ============================================
[tracing_subscriber]
"格式化层" = "fmt"
"JSON层" = "json"
"过滤器层" = "filter"
"注册表" = "registry"
"初始化" = "init"
