# i18n-rust 异步编程库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# tokio - 异步运行时
# ============================================
[tokio]
"主函数" = "main"
"生成任务" = "spawn"
"等待" = "await"
"选择" = "select"
"延迟" = "delay_for"
"间隔" = "interval"
"睡眠" = "sleep"
"阻塞任务" = "spawn_blocking"
"通道" = "channel"
"一次性通道" = "oneshot"
"广播通道" = "broadcast"

# ============================================
# async-std - 异步标准库
# ============================================
[async_std]
"任务" = "task"
"生成" = "spawn"
"阻塞" = "task::spawn_blocking"
"睡眠" = "task::sleep"
"流" = "stream"

# ============================================
# futures - 异步工具
# ============================================
[futures]
"未来" = "Future"
"流" = "Stream"
"接收器" = "Sink"
"选择" = "select"
"连接" = "join"
"尝试连接" = "try_join"
"轮询" = "poll"

# ============================================
# async-trait - 异步特征
# ============================================
[async_trait]
"异步特征" = "async_trait"
