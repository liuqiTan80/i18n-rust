# i18n-rust 数据库库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# sqlx - 数据库工具包
# ============================================
[sqlx]
"池" = "Pool"
"连接" = "Connection"
"查询" = "query"
"执行" = "execute"
"获取" = "fetch"
"获取全部" = "fetch_all"
"获取一个" = "fetch_one"
"获取可选" = "fetch_optional"
"事务" = "Transaction"
"迁移" = "migrate"

# ============================================
# diesel - ORM
# ============================================
[diesel]
"连接" = "Connection"
"查询构建器" = "QueryDsl"
"可插入" = "Insertable"
"可查询" = "Queryable"
"表" = "Table"
"选择" = "select"
"过滤" = "filter"
"排序" = "order"
"限制" = "limit"

# ============================================
# rusqlite - SQLite
# ============================================
[rusqlite]
"连接" = "Connection"
"语句" = "Statement"
"执行" = "execute"
"查询" = "query"
"准备" = "prepare"
