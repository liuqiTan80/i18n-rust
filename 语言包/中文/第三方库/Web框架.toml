# i18n-rust Web 框架映射表
# 格式：中文名称 = "英文原名"

# ============================================
# actix-web - Web 框架
# ============================================
[actix_web]
"应用" = "App"
"HTTP服务器" = "HttpServer"
"路由" = "route"
"资源" = "resource"
"作用域" = "scope"
"处理器" = "handler"
"请求" = "HttpRequest"
"响应" = "HttpResponse"
"JSON" = "Json"
"表单" = "Form"
"路径" = "Path"
"查询" = "Query"
"中间件" = "middleware"

