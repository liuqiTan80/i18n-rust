# i18n-rust 序列化库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# serde - 序列化/反序列化框架
# ============================================
[serde]
"可序列化" = "Serialize"
"可反序列化" = "Deserialize"
"序列化" = "serialize"
"反序列化" = "deserialize"

# ============================================
# serde_json - JSON 处理
# ============================================
[serde_json]
"JSON值" = "Value"
"JSON对象" = "Object"
"JSON数组" = "Array"
"从字符串解析" = "from_str"
"转字符串" = "to_string"
"从文件读取" = "from_reader"
"写入文件" = "to_writer"

# ============================================
# toml - TOML 处理
# ============================================
[toml]
"从字符串解析" = "from_str"
"转字符串" = "to_string"
"从文件读取" = "from_file"
"写入文件" = "to_file"

# ============================================
# bincode - 二进制序列化
# ============================================
[bincode]
"编码" = "encode"
"解码" = "decode"
"序列化" = "serialize"
"反序列化" = "deserialize"
