# i18n-rust 命令行库映射表
# 格式：中文名称 = "英文原名"

# ============================================
# clap - 命令行参数解析
# ============================================
[clap]
"命令行解析器" = "Command"
"参数" = "Arg"
"子命令" = "Subcommand"
"值解析" = "ValueEnum"
"解析器" = "Parser"
"长参数" = "long"
"短参数" = "short"
"帮助" = "help"
"版本" = "version"
"必需" = "required"
"默认值" = "default_value"

# ============================================
# structopt - 结构体命令行解析
# ============================================
[structopt]
"结构体选项" = "StructOpt"
"解析" = "parse"
"从参数解析" = "from_args"

# ============================================
# dialoguer - 交互式对话框
# ============================================
[dialoguer]
"输入框" = "Input"
"确认框" = "Confirm"
"选择框" = "Select"
"多选框" = "MultiSelect"
"密码框" = "Password"
"交互" = "Interact"

# ============================================
# console - 终端输出控制
# ============================================
[console]
"终端" = "Term"
"样式" = "Style"
"彩色" = "style"
"进度条" = "ProgressBar"
"旋转器" = "Spinner"
