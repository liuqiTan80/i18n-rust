# i18n-rust 标准库映射表
# 格式：中文名称 = "英文原名"
# 分类按 Rust 标准库模块组织

# ============================================
# 核心类型 (core)
# ============================================
[核心类型]
"选项" = "Option"
"有些" = "Some"
"无" = "None"
"结果" = "Result"
"成功" = "Ok"
"错误" = "Err"
"布尔" = "bool"
"真" = "true"
"假" = "false"

# ============================================
# 集合类型 (alloc / collections)
# ============================================
[集合]
"字符串" = "String"
"向量" = "Vec"
"哈希表" = "HashMap"
"哈希集" = "HashSet"
"键值对" = "BTreeMap"
"双向队列" = "VecDeque"
"链表" = "LinkedList"

# ============================================
# 输入输出 (std::io)
# ============================================
[输入输出]
"标准输入" = "stdin"
"标准输出" = "stdout"
"标准错误" = "stderr"
"读取器" = "Read"
"写入器" = "Write"
"缓冲读取器" = "BufReader"
"缓冲写入器" = "BufWriter"

# ============================================
# 格式化输出 (std::fmt / macros)
# ============================================
[格式化]
"打印" = "print"
"打印行" = "println"
"错误打印" = "eprint"
"错误打印行" = "eprintln"
"格式化" = "format"
"写入格式化" = "write"
"写入格式化行" = "writeln"

# ============================================
# 迭代器 (std::iter)
# ============================================
[迭代器]
"迭代器" = "Iterator"
"迭代" = "iter"
"可变迭代" = "iter_mut"
"消费迭代" = "into_iter"
"映射" = "map"
"过滤" = "filter"
"收集" = "collect"
"折叠" = "fold"
"枚举" = "enumerate"
"拉链" = "zip"
"跳过" = "skip"
"取值" = "take"
"链式" = "chain"

# ============================================
# 并发 (std::sync / std::thread)
# ============================================
[并发]
"互斥锁" = "Mutex"
"读写锁" = "RwLock"
"原子引用计数" = "Arc"
"引用计数" = "Rc"
"通道" = "channel"
"发送端" = "Sender"
"接收端" = "Receiver"
"线程" = "thread"
"生成线程" = "spawn"
"等待" = "join"

# ============================================
# 文件操作 (std::fs / std::path)
# ============================================
[文件系统]
"文件" = "File"
"路径" = "Path"
"路径缓冲" = "PathBuf"
"目录项" = "DirEntry"
"读取目录" = "read_dir"
"创建目录" = "create_dir"
"删除文件" = "remove_file"
"复制文件" = "copy"
"重命名" = "rename"

# ============================================
# 网络 (std::net)
# ============================================
[网络]
"网络地址" = "SocketAddr"
"网络地址v4" = "SocketAddrV4"
"网络地址v6" = "SocketAddrV6"
"IP地址" = "IpAddr"
"IP地址v4" = "Ipv4Addr"
"IP地址v6" = "Ipv6Addr"
"TCP监听器" = "TcpListener"
"TCP流" = "TcpStream"
"UDP套接字" = "UdpSocket"

# ============================================
# 时间 (std::time)
# ============================================
[时间]
"持续时间" = "Duration"
"瞬间" = "Instant"
"系统时间" = "SystemTime"
"秒" = "secs"
"毫秒" = "millis"
"微秒" = "micros"
"纳秒" = "nanos"

# ============================================
# 转换 (std::convert)
# ============================================
[转换]
"转换为" = "Into"
"从转换" = "From"
"尝试转换为" = "TryInto"
"尝试从转换" = "TryFrom"
"转换为" = "into"
"从转换" = "from"

# ============================================
# 常用函数入口
# ============================================
[入口]
"主函数" = "main"
"范围" = "range"
"断言" = "assert"
"断言相等" = "assert_eq"
"断言不等" = "assert_ne"
"未实现" = "unimplemented"
"待完成" = "todo"
"不可达" = "unreachable"
"恐慌" = "panic"
